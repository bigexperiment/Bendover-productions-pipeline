<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Bendover Pipeline Status</title>
  <style>
    :root { color-scheme: dark; font-family: ui-sans-serif, system-ui, sans-serif; }
    body { margin: 0; background:#101216; color:#eef1f5; }
    main { max-width:900px; margin:40px auto; padding:0 22px; }
    h1 { margin-bottom:6px; } .muted { color:#9aa4b2; }
    .card { background:#191d24; border:1px solid #2b3340; border-radius:14px; padding:18px; margin:14px 0; }
    .row { display:flex; justify-content:space-between; gap:20px; margin:10px 0; }
    .bar { height:12px; background:#2b3340; border-radius:99px; overflow:hidden; }
    #fill { height:100%; width:0; background:#5ee6a8; transition:width .3s; }
    pre { white-space:pre-wrap; max-height:330px; overflow:auto; color:#cbd5e1; }
    .ok { color:#5ee6a8 } .warn { color:#ffd166 }
  </style>
</head>
<body><main>
  <h1>Pipeline live status</h1><div class="muted">Auto-refreshing every second</div>
  <section class="card"><div class="row"><strong id="phase">Waiting</strong><span id="percent">0%</span></div><div class="bar"><div id="fill"></div></div><div class="row"><span id="project">—</span><span id="updated">—</span></div></section>
  <section class="card"><h2>What is happening</h2><div id="message" class="muted">Waiting for status.json</div><div class="row"><span>Images</span><span id="images">—</span></div><div class="row"><span>Audio</span><span id="audio">—</span></div><div class="row"><span>Output</span><span id="output">—</span></div></section>
  <section class="card"><h2>Event log</h2><pre id="log">No events yet.</pre></section>
  <script>
    async function refresh() {
      try {
        const r = await fetch('status.json?t=' + Date.now());
        const s = await r.json();
        const p = Math.max(0, Math.min(100, Number(s.percent || 0)));
        phase.textContent = s.phase || 'Working'; percent.textContent = p.toFixed(0) + '%'; fill.style.width = p + '%';
        project.textContent = s.project || '—'; updated.textContent = s.updated_at || '—';
        message.textContent = s.message || '—'; images.textContent = s.images || '—'; audio.textContent = s.audio || '—'; output.textContent = s.output || '—';
        log.textContent = (s.events || []).slice(-30).join('\n') || 'No events yet.';
      } catch (_) { message.textContent = 'Waiting for the pipeline status file…'; }
    }
    refresh(); setInterval(refresh, 1000);
  </script>
</main></body></html>
