<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bendover Productions</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:system-ui,-apple-system,sans-serif;background:#f3f4f6;color:#111;min-height:100vh}
    .wrap{max-width:620px;margin:0 auto;padding:28px 18px 80px}

    /* Header */
    .hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
    .hdr h1{font-size:19px;font-weight:800}
    .hdr .sub{font-size:13px;color:#6b7280;margin-top:2px}
    .btn-new{background:#111;color:#fff;border:none;border-radius:8px;padding:10px 18px;font-size:14px;font-weight:700;cursor:pointer}
    .btn-new:hover{background:#333}

    /* Queue status bar */
    .yt-auth-bar{display:flex;align-items:center;gap:10px;border-radius:10px;padding:11px 16px;margin-bottom:12px;font-size:13px;font-weight:600}
    .yt-auth-bar.ok{background:#f0fdf4;border:1px solid #86efac;color:#166534}
    .yt-auth-bar.err{background:#fef2f2;border:1px solid #fca5a5;color:#991b1b}
    .yt-auth-bar.warn{background:#fffbeb;border:1px solid #fcd34d;color:#92400e}
    .yt-connect,.yt-reconnect{color:inherit;font-weight:700;text-decoration:underline;cursor:pointer}
    .queue-bar{display:flex;align-items:center;gap:10px;background:#fff;border-radius:10px;padding:12px 16px;margin-bottom:20px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
    .queue-dot{width:9px;height:9px;border-radius:50%;background:#9ca3af;flex-shrink:0}
    .queue-dot.running{background:#16a34a;animation:pulse 1.4s ease infinite}
    .queue-dot.idle{background:#9ca3af}
    .queue-text{font-size:14px;font-weight:600;flex:1}
    .btn-queue{background:#16a34a;color:#fff;border:none;border-radius:6px;padding:7px 14px;font-size:13px;font-weight:700;cursor:pointer}
    .btn-queue:hover{background:#15803d}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

    /* Project cards */
    .proj-list{display:flex;flex-direction:column;gap:10px}
    .proj-card{background:#fff;border-radius:10px;padding:16px 18px;box-shadow:0 1px 3px rgba(0,0,0,.08);cursor:pointer;transition:box-shadow .15s}
    .proj-card:hover{box-shadow:0 3px 10px rgba(0,0,0,.12)}
    .proj-card-inner{display:flex;align-items:center;gap:12px}
    .proj-status-icon{font-size:20px;flex-shrink:0}
    .proj-info{flex:1;min-width:0}
    .proj-title{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .proj-subtitle{font-size:13px;color:#6b7280;margin-top:2px}
    .proj-badge{font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;flex-shrink:0}
    .badge-script{background:#ede9fe;color:#6d28d9}
    .badge-upload{background:#fff7ed;color:#c2410c}
    .badge-style{background:#fef9c3;color:#854d0e}
    .badge-queued{background:#f0fdf4;color:#166534}
    .badge-running{background:#dbeafe;color:#1d4ed8}
    .badge-thumbnails{background:#fce7f3;color:#9d174d}
    .badge-done{background:#f0fdf4;color:#166534}
    .badge-failed{background:#fef2f2;color:#991b1b}
    .empty-state{text-align:center;padding:48px 20px;color:#9ca3af}
    .empty-state .big{font-size:40px;margin-bottom:12px}
    .empty-state p{font-size:15px}

    /* Detail view */
    .detail-hdr{display:flex;align-items:center;gap:12px;margin-bottom:24px}
    .btn-back{background:none;border:none;font-size:22px;cursor:pointer;color:#6b7280;padding:2px 6px;border-radius:6px}
    .btn-back:hover{background:#e5e7eb;color:#111}
    .detail-title{font-size:19px;font-weight:800;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

    /* Steps */
    .step-bar{display:flex;align-items:center;margin-bottom:24px}
    .snode{display:flex;flex-direction:column;align-items:center;gap:3px;flex-shrink:0}
    .scircle{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;background:#e5e7eb;color:#9ca3af}
    .scircle.act{background:#2563eb;color:#fff}
    .scircle.done{background:#16a34a;color:#fff}
    .slabel{font-size:10px;font-weight:600;color:#9ca3af;white-space:nowrap}
    .slabel.act{color:#2563eb}
    .slabel.done{color:#16a34a}
    .sline{flex:1;height:2px;background:#e5e7eb;margin-bottom:14px}
    .sline.done{background:#16a34a}

    /* Cards */
    .card{background:#fff;border-radius:12px;padding:24px;box-shadow:0 1px 3px rgba(0,0,0,.08);margin-bottom:14px}
    .card-title{font-size:17px;font-weight:700;margin-bottom:5px}
    .card-sub{font-size:13px;color:#6b7280;margin-bottom:20px}

    /* AI chat section */
    .ai-chat{border:1px solid #e5e7eb;border-radius:10px;overflow:hidden;margin-bottom:14px}
    .ai-msgs{min-height:80px;max-height:360px;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;background:#fafafa}
    .msg{max-width:88%;padding:10px 13px;border-radius:10px;font-size:14px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
    .msg.user{background:#2563eb;color:#fff;align-self:flex-end;border-radius:10px 10px 2px 10px}
    .msg.ai{background:#fff;color:#111;align-self:flex-start;border:1px solid #e5e7eb;border-radius:10px 10px 10px 2px}
    .msg.thinking{color:#9ca3af;font-style:italic;background:transparent;border:none;padding:4px 0;font-size:13px}
    .ai-input-row{display:flex;border-top:1px solid #e5e7eb}
    .ai-input-row textarea{flex:1;padding:12px 14px;font-family:inherit;font-size:14px;border:none;outline:none;resize:none;height:56px}
    .ai-send-btn{background:#2563eb;color:#fff;border:none;padding:0 18px;font-size:14px;font-weight:700;cursor:pointer;flex-shrink:0}
    .ai-send-btn:hover{background:#1d4ed8}
    .ai-send-btn:disabled{opacity:.4;cursor:not-allowed}

    /* Script editor */
    .script-area{width:100%;padding:12px;font-family:ui-monospace,monospace;font-size:13px;border:1px solid #e5e7eb;border-radius:8px;min-height:200px;resize:vertical;outline:none;transition:border-color .15s}
    .script-area:focus{border-color:#2563eb}
    .script-meta{font-size:12px;color:#9ca3af;margin-top:6px}

    /* File blocks */
    .file-block{border:2px solid #e5e7eb;border-radius:10px;margin-bottom:10px;overflow:hidden}
    .file-block.ready{border-color:#16a34a}
    .fb-head{display:flex;align-items:center;gap:12px;padding:13px 15px}
    .fb-icon{font-size:20px;flex-shrink:0}
    .fb-info{flex:1;min-width:0}
    .fb-name{font-weight:700;font-size:14px}
    .fb-hint{font-size:12px;color:#9ca3af;margin-top:2px}
    .file-block.ready .fb-hint{color:#16a34a}
    .fb-acts{display:flex;gap:6px;flex-shrink:0}
    .zone{display:flex;align-items:center;gap:10px;border-top:1px dashed #e5e7eb;padding:12px 15px;cursor:pointer;background:#fafafa}
    .zone:hover{background:#eff6ff}
    .zone-text{font-size:13px;color:#6b7280}
    .fb-paste-btn{display:block;margin:0 15px 12px;padding:9px;text-align:center;border:1px solid #e5e7eb;border-radius:7px;font-size:13px;font-weight:600;cursor:pointer;color:#374151;background:#fff}
    .fb-paste-btn:hover{background:#f9fafb}
    .fb-ta-wrap{border-top:1px solid #e5e7eb;padding:12px 14px;background:#fafafa}
    .fb-ta-wrap textarea{width:100%;padding:9px 11px;font-family:ui-monospace,monospace;font-size:12px;border:1px solid #e5e7eb;border-radius:6px;min-height:140px;resize:vertical;outline:none}
    .fb-ta-wrap textarea:focus{border-color:#2563eb}
    .ta-btns{display:flex;gap:8px;margin-top:8px;justify-content:flex-end}

    /* Style grid */
    .style-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;max-height:320px;overflow-y:auto}
    .style-card{border:2px solid #e5e7eb;border-radius:8px;overflow:hidden;cursor:pointer;transition:border-color .15s}
    .style-card:hover{border-color:#93c5fd}
    .style-card.sel{border-color:#2563eb}
    .style-card.sel .sname{color:#2563eb}
    .style-card img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:#e5e7eb}
    .style-card .sname{font-size:11px;font-weight:600;padding:5px 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
    .style-no-img{width:100%;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;background:#f3f4f6;font-size:12px;color:#9ca3af}
    .sel-note{margin-top:10px;font-size:13px;color:#6b7280}
    .sel-note strong{color:#2563eb}

    /* Progress monitor */
    .prog-bar{background:#e5e7eb;border-radius:99px;height:13px;overflow:hidden;margin-bottom:6px}
    .prog-fill{background:#2563eb;height:100%;border-radius:99px;transition:width .5s}
    .prog-text{font-size:13px;color:#6b7280;margin-bottom:16px}
    .credits{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
    .cbox{background:#f9fafb;border:1px solid #e5e7eb;border-radius:8px;padding:12px}
    .cbox .clbl{font-size:10px;font-weight:700;text-transform:uppercase;color:#9ca3af;margin-bottom:5px}
    .cbox .cval{font-size:20px;font-weight:800}
    .cbox .creset{font-size:11px;color:#9ca3af;margin-top:2px}
    .cbox.warn .cval{color:#d97706}
    .cbox.empty .cval{color:#dc2626}
    .log-box{background:#111;color:#86efac;font-family:ui-monospace,monospace;font-size:12px;padding:12px;border-radius:8px;max-height:160px;overflow-y:auto;white-space:pre-wrap;word-break:break-all}

    /* Thumbnails */
    .thumb-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
    .thumb-item{border:3px solid #e5e7eb;border-radius:8px;overflow:hidden;cursor:pointer;transition:border-color .15s}
    .thumb-item:hover{border-color:#93c5fd}
    .thumb-item.sel{border-color:#2563eb}
    .thumb-item.sel .thumb-lbl{color:#2563eb}
    .thumb-item img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block}
    .thumb-ph{aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;background:#f3f4f6;font-size:12px;color:#9ca3af;text-align:center;padding:6px}
    .thumb-lbl{text-align:center;padding:6px;font-size:12px;font-weight:700;color:#9ca3af}

    /* Buttons */
    button{font-family:inherit;cursor:pointer;transition:background .15s,opacity .15s}
    .btn-primary{background:#2563eb;color:#fff;border:none;border-radius:8px;padding:12px 20px;font-size:15px;font-weight:700;width:100%}
    .btn-primary:hover:not(:disabled){background:#1d4ed8}
    .btn-primary:disabled{opacity:.4;cursor:not-allowed}
    .btn-green{background:#16a34a;color:#fff;border:none;border-radius:8px;padding:12px 20px;font-size:15px;font-weight:700;width:100%}
    .btn-green:hover:not(:disabled){background:#15803d}
    .btn-green:disabled{opacity:.4;cursor:not-allowed}
    .btn-red{background:#dc2626;color:#fff;border:none;border-radius:8px;padding:12px 20px;font-size:15px;font-weight:700;width:100%}
    .btn-red:hover:not(:disabled){background:#b91c1c}
    .btn-red:disabled{opacity:.4;cursor:not-allowed}
    .btn-sm{padding:6px 12px;border:1px solid #e5e7eb;border-radius:6px;font-size:12px;font-weight:600;background:#fff;color:#374151}
    .btn-sm:hover{background:#f9fafb}
    .btn-sm.danger{color:#dc2626;border-color:#fca5a5}
    .btn-sm.danger:hover{background:#fef2f2}
    .btn-row{display:flex;gap:10px;margin-top:18px}
    .btn-row .btn-primary,.btn-row .btn-green{flex:1}
    .btn-secondary{background:#f3f4f6;color:#374151;border:none;border-radius:8px;padding:12px 20px;font-size:15px;font-weight:600}
    .btn-secondary:hover{background:#e5e7eb}

    /* Alerts */
    .alert{border-radius:8px;padding:11px 13px;font-size:13px;margin-bottom:14px}
    .alert.info{background:#eff6ff;border:1px solid #93c5fd}
    .alert.ok{background:#f0fdf4;border:1px solid #86efac;color:#166534}
    .alert.warn{background:#fef3c7;border:1px solid #fbbf24}

    /* Inputs */
    .field{margin-bottom:16px}
    .field label{display:block;font-weight:600;font-size:13px;margin-bottom:5px}
    .field input,.field textarea{width:100%;padding:10px 12px;font-family:inherit;font-size:14px;border:2px solid #e5e7eb;border-radius:8px;outline:none;transition:border-color .15s}
    .field input:focus,.field textarea:focus{border-color:#2563eb}
    .field textarea{resize:vertical;min-height:64px}
    .field .hint{font-size:12px;color:#9ca3af;margin-top:4px}

    /* Done screen */
    .done-box{text-align:center;padding:16px 0}
    .done-box .big{font-size:48px;margin-bottom:12px}
    .done-box h2{font-size:21px;margin-bottom:8px}
    .done-box p{color:#6b7280;margin-bottom:20px;font-size:14px}
    .done-links{display:flex;flex-direction:column;gap:9px}
    .done-links a{display:block;padding:12px;border-radius:8px;text-decoration:none;font-weight:700;font-size:15px;text-align:center}
    .link-yt{background:#dc2626;color:#fff}
    .link-studio{background:#f3f4f6;color:#374151}

    /* Toast */
    .toast{
      position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(20px);
      background:#111;color:#fff;padding:11px 20px;border-radius:8px;font-size:14px;font-weight:600;
      opacity:0;transition:opacity .2s,transform .2s;z-index:999;pointer-events:none;white-space:nowrap;
    }
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    .toast.ok{background:#16a34a}
    .toast.err{background:#dc2626}

    /* Queue log panel */
    .queue-log-panel{background:#fff;border-radius:10px;padding:16px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
    .queue-log-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
    .queue-log-hdr span{font-size:13px;font-weight:700;color:#374151}
    .queue-log-hdr button{background:none;border:none;font-size:12px;color:#6b7280;cursor:pointer;text-decoration:underline}

    /* Misc */
    input[type=file]{display:none}
    .sep{height:1px;background:#e5e7eb;margin:16px 0}
  </style>
</head>
<body>
<div class="wrap" id="app">Loading…</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- Hidden file inputs -->
<input type="file" id="fi-script"     accept=".txt">
<input type="file" id="fi-audio"      accept=".mp3,.wav,.m4a">
<input type="file" id="fi-transcript" accept=".txt">

<script>
// ── App state ──────────────────────────────────────────────────────
const APP = {
  screen: 'list',     // list | detail
  projects: [],
  queueRunning: false,
  queueLog: [],
  showQueueLog: false,
  ytAuth: null,   // {has_secrets, has_token}
  supabase: null, // {configured, url}
  // detail
  activeId: null,
  detail: null,
  detailStep: 1,      // 1=script 2=upload 3=style 4=running/thumb/done
  presets: [],
  pickedStyleId: '', pickedStyleLabel: '', pickedImageStyle: '',
  selectedThumb: null,
  progress: null,      // live progress for running project
  // per-file ui mode
  scriptMode: 'idle',   // idle | paste | edit
  transMode: 'idle',
  scriptContent: null, transContent: null,
  // chat
  chatMsgs: [],
};

// ── API ────────────────────────────────────────────────────────────
const api = (path, opts) => fetch(path, opts).then(r => r.json());

async function uploadFile(kind, file, projectId) {
  const fd = new FormData();
  fd.append('kind', kind);
  fd.append('file', file, file.name);
  const url = projectId ? `/api/projects/${projectId}/upload` : '/api/upload';
  return fetch(url, { method: 'POST', body: fd }).then(r => r.json());
}

// ── Poll ───────────────────────────────────────────────────────────
let pollTimer = null;
async function poll() {
  try {
    const r = await api('/api/projects');
    APP.projects = r.projects || [];
    APP.queueRunning = !!r.queue_running;

    if (!APP.presets.length) {
      const ps = await api('/api/style-presets');
      APP.presets = ps.presets || [];
    }

    // Check YouTube auth status periodically
    if (!APP.ytAuth || Math.random() < 0.1) {
      APP.ytAuth = await api('/api/youtube/auth/status');
    }

    // Check Supabase config status periodically
    if (!APP.supabase || Math.random() < 0.05) {
      APP.supabase = await api('/api/supabase/config').catch(() => ({ configured: false }));
    }

    if (APP.queueRunning || APP.showQueueLog) {
      const ql = await api('/api/queue/log');
      APP.queueLog = ql.lines || [];
      if (!ql.running && APP.queueRunning) {
        // just stopped
        toast('Queue finished', 'ok', 4000);
      }
      APP.queueRunning = ql.running;
    }

    if (APP.screen === 'detail' && APP.activeId) {
      const d = await api(`/api/projects/${APP.activeId}`);
      APP.detail = d;
      const st = d.status;
      if (st === 'script')     APP.detailStep = 1;
      else if (st === 'upload') APP.detailStep = 2;
      else if (st === 'style')  APP.detailStep = 3;
      else if (['queued','running','thumbnails','done','failed'].includes(st)) APP.detailStep = 4;

      // Fetch live progress if running or thumbnails stage
      if (['running','thumbnails'].includes(st) || APP.progress) {
        APP.progress = await api(`/api/projects/${APP.activeId}/progress`);
        // Auto-detect thumbnail-ready → switch status
        if (APP.progress.thumbnails?.some(t => t.exists) && st === 'running') {
          d.status = 'thumbnails';
          update_project_queue_status_local(APP.activeId, 'thumbnails');
        }
        // Auto-detect done
        if (APP.progress.youtube_video_id && st !== 'done') {
          d.status = 'done';
        }
      }
    }

    renderIfChanged();
  } catch(e) { console.error('poll', e); }
  pollTimer = setTimeout(poll, 4000);
}

// ── Render ─────────────────────────────────────────────────────────
let _lastRenderKey = '';
function renderIfChanged() {
  // Never interrupt user while they're typing or a modal is open
  const active = document.activeElement;
  if (active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA' || active.tagName === 'SELECT')) return;
  if (document.querySelector('.modal-overlay')) return;
  // Skip full re-render if nothing meaningful changed
  const key = JSON.stringify({
    screen: APP.screen,
    projects: APP.projects.map(p => p.status + p.id),
    queueRunning: APP.queueRunning,
    queueLog: APP.queueLog.length,
    activeId: APP.activeId,
    detailStatus: APP.detail?.status,
    detailStep: APP.detailStep,
    progress: APP.progress ? `${APP.progress.stage}:${APP.progress.done_frames}` : null,
    thumbs: APP.progress?.thumbnails?.map(t => t.exists).join(''),
    ytAuth: APP.ytAuth?.has_token,
    showLog: APP.showQueueLog,
  });
  if (key === _lastRenderKey) return;
  _lastRenderKey = key;
  render();
}

function render() {
  document.getElementById('app').innerHTML =
    APP.screen === 'list'   ? renderList() :
    APP.screen === 'detail' ? renderDetail() : '';
  bindEvents();
}

// ── PROJECT LIST ───────────────────────────────────────────────────
const STATUS_ICON = {
  script:'📝', upload:'📁', style:'🎨', queued:'⏳',
  running:'▶️', thumbnails:'🖼', done:'✅', failed:'❌', unknown:'❓'
};
const STATUS_LABEL = {
  script:'Write script', upload:'Upload files', style:'Pick style',
  queued:'In queue', running:'Running…', thumbnails:'Pick thumbnail',
  done:'Done', failed:'Failed', unknown:'Unknown'
};
const STATUS_BADGE = {
  script:'badge-script', upload:'badge-upload', style:'badge-style',
  queued:'badge-queued', running:'badge-running', thumbnails:'badge-thumbnails',
  done:'badge-done', failed:'badge-failed', unknown:''
};

function renderList() {
  const qRunning = APP.queueRunning;
  const qPending = APP.projects.filter(p => p.status === 'queued').length;

  const cards = APP.projects.length
    ? APP.projects.map(p => {
        const st = p.status || 'unknown';
        const isActive = p.id === APP.activeId;
        const pr2 = isActive ? APP.progress : null;
        let subtitle = STATUS_LABEL[st] || st;
        if (st === 'running' && pr2) {
          const stageLabels = {
            images:`🎨 Frames ${pr2.done_frames||0}/${pr2.total_frames||'?'}${pr2.img_phase==='waiting_credits'?' — credits paused':''}`,
            render_pending:'✂️ Starting render…', rendering:'✂️ Rendering…',
            render_done:'🖼 Generating thumbnails…', thumbnails:'🖼 Thumbnails ready',
            uploading:'📤 Uploading…', done:'✅ Done'
          };
          subtitle = stageLabels[pr2.stage] || 'Running…';
        }
        return `<div class="proj-card" data-pid="${esc(p.id)}">
          <div class="proj-card-inner">
            <span class="proj-status-icon">${STATUS_ICON[st]||'❓'}</span>
            <div class="proj-info">
              <div class="proj-title">${esc(p.title||p.id)}</div>
              <div class="proj-subtitle">${subtitle}</div>
            </div>
            <span class="proj-badge ${STATUS_BADGE[st]||''}">${st}</span>
          </div>
        </div>`;
      }).join('')
    : `<div class="empty-state"><div class="big">🎬</div><p>No videos yet.<br>Hit "New video" to start.</p></div>`;

  const logPanel = APP.showQueueLog ? `
    <div class="queue-log-panel">
      <div class="queue-log-hdr">
        <span>Queue log</span>
        <button id="btn-hide-log">hide</button>
      </div>
      <div class="log-box">${esc(APP.queueLog.slice(-30).join('\n') || 'No output yet…')}</div>
    </div>` : '';

  const queueBar = `${logPanel}<div class="queue-bar">

    <span class="queue-text">${qRunning ? 'Pipeline running…' : qPending ? `${qPending} video${qPending>1?'s':''} queued` : 'Pipeline idle'}</span>

// ── PROJECT DETAIL ─────────────────────────────────────────────────
function renderDetail() {
  const d = APP.detail;
  if (!d) return `<div style="color:#9ca3af;padding:40px;text-align:center">Loading…</div>`;

  const st = d.status || 'script';
  const title = d.title || d.id || 'Untitled';

  const hdr = `<div class="detail-hdr">
    <button class="btn-back" id="btn-back">←</button>
    <div class="detail-title">${esc(title)}</div>
  </div>`;

  // Step bar
  const steps = ['Script','Upload','Style','Launch'];
  const cs = APP.detailStep;
  const nodes = steps.map((lbl,i) => {
    const n = i+1;
    const isDone = n < cs;
    const isAct  = n === cs;
    const c = isDone?'done':isAct?'act':'';
    return `<div class="snode">
      <div class="scircle ${c}">${isDone?'✓':n}</div>
      <div class="slabel ${c}">${lbl}</div>
    </div>`;
  });
  const lines = [0,1,2].map(i => `<div class="sline ${cs>i+1?'done':''}"></div>`);
  const stepBar = `<div class="step-bar">${nodes[0]}${lines[0]}${nodes[1]}${lines[1]}${nodes[2]}${lines[2]}${nodes[3]}</div>`;

  let body = '';
  if (cs === 1) body = renderDetailScript(d);
  else if (cs === 2) body = renderDetailUpload(d);
  else if (cs === 3) body = renderDetailStyle(d);
  else if (cs === 4) body = renderDetailLaunch(d);

  return hdr + stepBar + body;
}

// Step 4: Launch / Running / Thumbnails / Done
function renderDetailLaunch(d) {
  const st = d.status;
  const pr = APP.progress;

  if (st === 'queued') {
    return `<div class="card">
      <div class="card-title">⏳ Queued</div>
      <div class="card-sub">Waiting for the pipeline to pick this up.</div>
      <div class="alert info">Once started: all frames will be generated, video rendered, 3 thumbnails created, and you'll get an ntfy alert to pick one. Credits auto-pause and resume.</div>
      ${!APP.queueRunning ? `<button class="btn-green" id="btn-start-queue2">▶ Start queue now</button>` : `<p style="font-size:13px;color:#6b7280;margin-top:4px">Queue runner is active — will pick this up automatically.</p>`}
    </div>`;
  }

  // Show thumbnail picker if queue status is thumbnails, OR if pipeline stage reached thumbnails
  const prStage = pr?.stage;
  const showThumbs = st === 'thumbnails'
    || (prStage === 'thumbnails' && pr?.thumbnails?.some(t => t.exists));
  if (showThumbs) return renderThumbnailPicker(d, pr);

  if (st === 'running' || (st !== 'done' && st !== 'failed' && pr)) {
    return renderRunningDetail(d, pr);
  }

  if (st === 'done') {
    const yt = d.youtube_video_id || pr?.youtube_video_id;
    return `<div class="card"><div class="done-box">
      <div class="big">🎉</div>
      <h2>Video is live!</h2>
      <p>Uploaded to YouTube successfully.</p>
      <div class="done-links">
        <a class="link-yt" href="https://youtu.be/${esc(yt)}" target="_blank">Watch on YouTube →</a>
        <a class="link-studio" href="https://studio.youtube.com/video/${esc(yt)}/edit" target="_blank">Open YouTube Studio</a>
      </div>
    </div></div>`;
  }

  if (st === 'failed') {
    const lines = (pr?.log_lines || d.log_lines || []).slice(-20).join('\n');
    return `<div class="card">
      <div class="card-title">❌ Pipeline failed</div>
      <div class="alert warn">Check the log below, fix the issue, then re-queue.</div>
      <div class="log-box">${esc(lines||'No log')}</div>
      <button class="btn-primary" id="btn-requeue" style="margin-top:14px">Re-add to queue</button>
    </div>`;
  }

  return `<div class="card"><p style="color:#9ca3af">Status: ${st}</p></div>`;
}

const STAGE_INFO = {
  images:        { icon: '🎨', label: 'Generating frames',         sub: null },
  render_pending:{ icon: '✂️',  label: 'All frames done — starting render…', sub: null },
  rendering:     { icon: '✂️',  label: 'Rendering video',          sub: null },
  render_done:   { icon: '🖼',  label: 'Render done — making thumbnails…', sub: null },
  thumbnails:    { icon: '🖼',  label: 'Creating thumbnails + description', sub: null },
  uploading:     { icon: '📤',  label: 'Uploading to YouTube…',    sub: null },
  done:          { icon: '✅',  label: 'Done!',                    sub: null },
};

function renderRunningDetail(d, pr) {
  const stage     = pr?.stage || 'images';
  const imgPhase  = pr?.img_phase || '';
  const done      = pr?.done_frames  || 0;
  const total     = pr?.total_frames || 0;
  const pct       = total ? Math.round(done / total * 100) : 0;
  const waiting   = imgPhase === 'waiting_credits';
  const fh        = pr?.five_hour || {};
  const wk        = pr?.weekly    || {};
  const logLines  = pr?.log_lines || d.log_lines || [];

  const info = STAGE_INFO[stage] || STAGE_INFO.images;

  // Stage pipeline visual
  const stages = ['images','rendering','thumbnails','uploading'];
  const stageIdx = stages.indexOf(stage.replace('render_pending','rendering').replace('render_done','thumbnails'));
  const stagePipeline = `<div style="display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap">
    ${['🎨 Frames','✂️ Render','🖼 Thumbnails','📤 Upload'].map((lbl,i) => {
      const done2 = i < stageIdx;
      const act   = i === stageIdx;
      const bg    = done2 ? '#f0fdf4' : act ? '#eff6ff' : '#f9fafb';
      const col   = done2 ? '#16a34a' : act ? '#2563eb' : '#9ca3af';
      const bdr   = done2 ? '#86efac' : act ? '#93c5fd' : '#e5e7eb';
      return `<div style="padding:5px 10px;border-radius:6px;border:1px solid ${bdr};background:${bg};color:${col};font-size:12px;font-weight:700">${done2?'✓ ':''}${lbl}</div>`;
    }).join('')}
  </div>`;

  // Frame progress (only during images stage)
  let frameSection = '';
  if (stage === 'images' || (stage !== 'rendering' && stage !== 'thumbnails' && stage !== 'uploading' && stage !== 'done')) {
    if (total > 0) {
      frameSection = `<div class="prog-bar"><div class="prog-fill" style="width:${pct}%"></div></div>
        <div class="prog-text" style="margin-bottom:16px">${done} / ${total} frames &nbsp;·&nbsp; ${pct}%${waiting?' &nbsp;·&nbsp; <strong style="color:#d97706">Credits paused</strong>':''}</div>`;
    } else {
      frameSection = `<div class="prog-text" style="margin-bottom:16px;color:#9ca3af">Building frame list…</div>`;
    }
  }

  // Credit boxes (only during image stage)
  let creditSection = '';
  if (stage === 'images') {
    const credBox = (lbl, c) => {
      if (!c || c.pct === null) return `<div class="cbox"><div class="clbl">${lbl}</div><div class="cval">—</div></div>`;
      const p = Math.round(c.pct);
      const cls = waiting && p === 0 ? 'empty' : p <= 10 ? 'warn' : '';
      return `<div class="cbox ${cls}"><div class="clbl">${lbl}</div><div class="cval">${p}%</div>
        <div class="creset">${p === 0 && waiting ? `Auto-resumes in ${c.reset||'?'}` : `Resets in ${c.reset||'?'}`}</div></div>`;
    };
    creditSection = `<div class="credits">${credBox('5-hour credits', fh)}${credBox('Weekly credits', wk)}</div>`;
  }

  return `<div class="card">
    <div style="display:flex;align-items:center;gap:9px;margin-bottom:16px">
      <span class="queue-dot running" style="width:10px;height:10px;flex-shrink:0"></span>
      <span style="font-size:16px;font-weight:700">${info.icon} ${info.label}</span>
    </div>
    ${stagePipeline}
    ${frameSection}
    ${creditSection}
    <div style="font-size:12px;font-weight:700;color:#9ca3af;text-transform:uppercase;margin-bottom:6px">Live log</div>
    <div class="log-box">${esc(logLines.slice(-20).join('\n') || 'No output yet…')}</div>
  </div>`;
}

function renderThumbnailPicker(d, pr) {
  const thumbs = pr?.thumbnails || d.thumbnails || [];
  const anyExist = thumbs.some(t => t.exists);
  const sel = APP.selectedThumb;
  const selExists = sel && thumbs.find(t => t.n === sel)?.exists;
  const t = Math.floor(Date.now() / 10000);

  const grid = [1,2,3].map(n => {
    const tv = thumbs.find(x => x.n === n);
    const isSel = sel === n ? 'sel' : '';
    const img = tv?.exists
      ? `<img src="/projects/${d.id}/tracker/thumbs/thumbnail_v${n}.png?t=${t}" alt="v${n}">`
      : `<div class="thumb-ph">⏳<br>Generating…</div>`;
    return `<div class="thumb-item ${isSel}" data-tv="${n}">${img}<div class="thumb-lbl">Option ${n}</div></div>`;
  }).join('');

  return `<div class="card">
    <div class="card-title">🖼 Pick a thumbnail</div>
    <div class="card-sub">Click the one you want — it uploads to YouTube automatically.</div>
    ${!anyExist ? '<div class="alert warn">Still generating thumbnails… check back in a moment.</div>' : ''}
    <div class="thumb-grid">${grid}</div>
    ${sel && selExists
      ? `<button class="btn-red" id="btn-upload-yt" style="margin-top:12px">✅ Approve Option ${sel} &amp; Upload to YouTube →</button>`
      : `<p style="text-align:center;color:#9ca3af;font-size:14px;margin-top:12px">← Click a thumbnail to approve it</p>`
    }
  </div>`;
}

// ── Bind events ────────────────────────────────────────────────────
function bindEvents() {
  // List screen
  document.getElementById('btn-new-video')?.addEventListener('click', () => showNewVideoModal());
  document.getElementById('btn-start-queue')?.addEventListener('click', function() { startQueue(this); });
  document.getElementById('btn-stop-queue')?.addEventListener('click', async function() {
    this.disabled = true; this.textContent = 'Stopping…';
    await api('/api/queue/stop', { method: 'POST' });
    APP.queueRunning = false;
    toast('Pipeline stopped', 'ok', 3000);
    render();
  });
  document.getElementById('btn-show-log')?.addEventListener('click', () => { APP.showQueueLog = !APP.showQueueLog; render(); });
  document.getElementById('btn-hide-log')?.addEventListener('click', () => { APP.showQueueLog = false; render(); });
  document.querySelectorAll('.proj-card').forEach(el => {
    el.addEventListener('click', () => openProject(el.dataset.pid));
  });

  // Supabase sync
  document.getElementById('sb-sync-btn')?.addEventListener('click', async (e) => {
    e.preventDefault();
    const el = e.target; el.textContent = 'Syncing…';
    const r = await api('/api/supabase/sync', { method: 'POST' }).catch(() => ({ ok: false }));
    if (r.ok) {
      toast('Supabase sync started', 'ok', 3000);
    } else {
      toast('Sync failed: ' + (r.error || 'unknown'), 'err', 4000);
    }
    el.textContent = 'Sync now';
  });

  // Detail: back
  document.getElementById('btn-back')?.addEventListener('click', () => {
    APP.screen = 'list'; APP.activeId = null; APP.detail = null;
    APP.chatMsgs = []; APP.scriptMode = 'idle'; APP.transMode = 'idle';
    APP.scriptContent = null; APP.transContent = null;
    render();
  });

  // Detail: step 1 - script
  bindScriptStep();
  // Detail: step 2 - upload
  bindUploadStep();
  // Detail: step 3 - style
  bindStyleStep();
  // Detail: step 4
  bindLaunchStep();
}

function bindScriptStep() {
  // Quick action buttons
  document.querySelectorAll('[data-quick]').forEach(btn => {
    btn.addEventListener('click', () => {
      const d = APP.detail;
      const inpEl = document.getElementById('chat-inp');
      if (btn.dataset.quick === 'ideas') {
        inpEl.value = 'Brainstorm 5 YouTube video ideas for an educational channel';
        sendChat();
      } else if (btn.dataset.quick === 'write') {
        inpEl.value = `Write a complete script for a video about: ${d?.title || '(describe the topic)'}`;
        sendChat('write_script');
      } else if (btn.dataset.quick === 'improve') {
        sendChat('improve_script');
      }
    });
  });

  // Chat send
  document.getElementById('chat-send')?.addEventListener('click', () => sendChat());
  document.getElementById('chat-inp')?.addEventListener('keydown', e => {
    if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) sendChat();
  });

  // Script file actions
  document.querySelector('[data-fa="edit-script"]')?.addEventListener('click', async () => {
    const r = await api(`/api/text-content?kind=script&project=${APP.activeId}`);
    APP.scriptContent = r.content || '';
    APP.scriptMode = 'edit';
    render();
    setTimeout(() => {
      const ta = document.getElementById('script-ta');
      if (ta) { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
    }, 50);
  });
  document.querySelector('[data-fa="del-script"]')?.addEventListener('click', async () => {
    if (!confirm('Delete script?')) return;
    await api('/api/text-content/delete', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ kind: 'script', project_id: APP.activeId }) });
    APP.detail.has_script = false; APP.detail.script_chars = 0;
    APP.scriptMode = 'idle'; APP.scriptContent = null;
    render();
  });
  document.querySelector('[data-fa="cancel-script"]')?.addEventListener('click', () => {
    APP.scriptMode = 'idle'; APP.scriptContent = null; render();
  });
  document.querySelector('[data-fa="save-script"]')?.addEventListener('click', async () => {
    const ta = document.getElementById('script-ta');
    const content = ta?.value || '';
    const r = await api('/api/text-content', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ kind: 'script', content, project_id: APP.activeId }) });
    if (r.ok) {
      APP.detail.has_script = !!content.trim();
      APP.detail.script_chars = r.chars || 0;
      APP.scriptMode = 'idle'; APP.scriptContent = null;
      render();
    }
  });

  // Script textarea char count
  document.getElementById('script-ta')?.addEventListener('input', e => {
    const cc = document.getElementById('script-char-count');
    if (cc) cc.textContent = `${e.target.value.length} chars`;
  });

  // Next button
  document.getElementById('btn-script-next')?.addEventListener('click', async () => {
    await api(`/api/projects/${APP.activeId}/update`, {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ status: 'upload' }),
    });
    APP.detailStep = 2;
    render();
  });
}

async function sendChat(forceTask = null) {
  const inpEl = document.getElementById('chat-inp');
  const text = inpEl?.value?.trim() || '';
  const d = APP.detail || {};

  const task = forceTask || (text.toLowerCase().includes('script') && text.toLowerCase().includes('write') ? 'write_script' : 'chat');

  if (!text && task !== 'improve_script') return;
  if (inpEl) inpEl.value = '';

  if (text) APP.chatMsgs.push({ role: 'user', text });
  APP.chatMsgs.push({ role: 'thinking', text: 'Codex is thinking…' });
  render();

  // scroll to bottom
  setTimeout(() => {
    const el = document.getElementById('chat-msgs');
    if (el) el.scrollTop = el.scrollHeight;
  }, 50);

  let scriptContent = '';
  if (task === 'improve_script' && d.has_script) {
    const sc = await api(`/api/text-content?kind=script&project=${APP.activeId}`);
    scriptContent = sc.content || '';
  }

  const res = await api('/api/ai', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({
      task,
      prompt: text,
      project_id: APP.activeId,
      context: { title: d.title||'', brief: d.brief||'', script: scriptContent },
    }),
  });

  // Remove "thinking" placeholder
  APP.chatMsgs = APP.chatMsgs.filter(m => m.role !== 'thinking');

  if (!res.ok) {
    APP.chatMsgs.push({ role: 'ai', text: '⚠️ ' + (res.error || 'Error') });
  } else if (res.saved_to === 'script') {
    APP.chatMsgs.push({ role: 'ai', text: `✅ Script written (${res.chars} chars). You can review and edit it below.` });
    if (APP.detail) { APP.detail.has_script = true; APP.detail.script_chars = res.chars; }
    APP.scriptContent = res.content;
    APP.scriptMode = 'edit';
  } else {
    APP.chatMsgs.push({ role: 'ai', text: res.response || '(no response)' });
  }
  render();
  setTimeout(() => {
    const el = document.getElementById('chat-msgs');
    if (el) el.scrollTop = el.scrollHeight;
  }, 50);
}

function bindUploadStep() {
  // File zone clicks
  document.querySelectorAll('.zone[data-upload]').forEach(el => {
    el.addEventListener('click', () => {
      const kind = el.dataset.upload;
      document.getElementById(`fi-${kind}`)?.click();
    });
  });

  // File inputs
  ['script','audio','transcript'].forEach(kind => {
    const inp = document.getElementById(`fi-${kind}`);
    if (!inp) return;
    inp.onchange = async e => {
      const file = e.target.files[0]; if (!file) return;
      const r = await uploadFile(kind, file, APP.activeId);
      if (r.ok) {
        if (kind === 'audio')      { APP.detail.has_audio = true; }
        if (kind === 'transcript') { APP.detail.has_transcript = true; APP.detail.transcript_chars = r.chars||0; }
        render();
      } else alert('Upload failed: ' + (r.error||'error'));
      inp.value = '';
    };
  });

  // Paste/edit/save for transcript
  ['transcript'].forEach(kind => {
    document.querySelector(`[data-fa="paste-${kind}"]`)?.addEventListener('click', () => {
      if (kind === 'transcript') { APP.transMode = 'paste'; APP.transContent = ''; }
      render();
      setTimeout(() => document.getElementById(`ta-${kind}`)?.focus(), 50);
    });
    document.querySelector(`[data-fa="edit-${kind}"]`)?.addEventListener('click', async () => {
      const r = await api(`/api/text-content?kind=${kind}&project=${APP.activeId}`);
      if (kind === 'transcript') { APP.transMode = 'edit'; APP.transContent = r.content || ''; }
      render();
    });
    document.querySelector(`[data-fa="cancel-${kind}"]`)?.addEventListener('click', () => {
      if (kind === 'transcript') { APP.transMode = 'idle'; APP.transContent = null; }
      render();
    });
    document.querySelector(`[data-fa="save-${kind}"]`)?.addEventListener('click', async () => {
      const ta = document.getElementById(`ta-${kind}`);
      const content = ta?.value || '';
      const r = await api('/api/text-content', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ kind, content, project_id: APP.activeId }) });
      if (r.ok) {
        if (kind === 'transcript') { APP.detail.has_transcript = !!content.trim(); APP.detail.transcript_chars = r.chars||0; APP.transMode = 'idle'; APP.transContent = null; }
        render();
      }
    });
    document.querySelector(`[data-fa="del-${kind}"]`)?.addEventListener('click', async () => {
      if (!confirm(`Delete ${kind}?`)) return;
      await api('/api/text-content/delete', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ kind, project_id: APP.activeId }) });
      if (kind === 'transcript') { APP.detail.has_transcript = false; APP.detail.transcript_chars = 0; APP.transMode = 'idle'; }
      render();
    });
  });

  document.getElementById('btn-upload-next')?.addEventListener('click', async () => {
    await api(`/api/projects/${APP.activeId}/update`, {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ status: 'style' }),
    });
    APP.detailStep = 3; render();
  });
}

function bindStyleStep() {
  document.querySelectorAll('.style-card').forEach(el => {
    el.addEventListener('click', () => {
      APP.pickedStyleId    = el.dataset.sid;
      APP.pickedStyleLabel = el.dataset.slabel;
      APP.pickedImageStyle = el.dataset.simg;
      document.querySelectorAll('.style-card').forEach(c => c.classList.remove('sel'));
      el.classList.add('sel');
      const note = document.querySelector('.sel-note');
      if (note) note.innerHTML = `Selected: <strong>${esc(APP.pickedStyleLabel)}</strong>`;
      document.getElementById('btn-style-approve').disabled = false;
    });
  });

  document.getElementById('btn-style-approve')?.addEventListener('click', async () => {
    const btn = document.getElementById('btn-style-approve');
    btn.disabled = true; btn.textContent = 'Saving…';
    const preset = APP.presets.find(p => p.id === APP.pickedStyleId);
    // Save style to project
    await api(`/api/projects/${APP.activeId}/update`, {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        style_preset_id: APP.pickedStyleId,
        style_preset_label: APP.pickedStyleLabel,
        image_style: preset?.image_style || APP.pickedImageStyle,
        style_approved: true,
        status: 'queued',
      }),
    });
    // Queue it
    await api(`/api/projects/${APP.activeId}/queue`, { method: 'POST' });
    APP.detailStep = 4;
    render();
  });
}

function bindLaunchStep() {
  document.getElementById('btn-start-queue2')?.addEventListener('click', function() { startQueue(this); });
  document.getElementById('btn-requeue')?.addEventListener('click', async () => {
    await api(`/api/projects/${APP.activeId}/queue`, { method: 'POST' });
    render();
  });

  // Thumbnail pick
  document.querySelectorAll('.thumb-item').forEach(el => {
    el.addEventListener('click', async () => {
      const n = +el.dataset.tv;
      const thumbs = APP.progress?.thumbnails || APP.detail?.thumbnails || [];
      const t = thumbs.find(x => x.n === n);
      if (!t?.exists) return;
      APP.selectedThumb = n;
      render(); // show selection immediately
      await api(`/api/projects/${APP.activeId}/thumbnail/select`, {
        method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ variant: n }),
      });
    });
  });

  document.getElementById('btn-upload-yt')?.addEventListener('click', async () => {
    const btn = document.getElementById('btn-upload-yt');
    btn.disabled = true; btn.textContent = '📤 Uploading…';
    try {
      const r = await api(`/api/projects/${APP.activeId}/upload/youtube`, { method: 'POST' });
      if (!r.ok) {
        btn.disabled = false; btn.textContent = '✅ Approve & Upload →';
        toast('Upload failed: ' + (r.error || 'unknown error'), 'err', 8000);
      } else {
        toast('Upload started — this can take a minute…', 'ok', 5000);
        // Poll job status until done or error
        const checkJob = async () => {
          const job = await api('/api/job/status');
          if (job.status === 'running') {
            setTimeout(checkJob, 3000);
          } else if (job.status === 'error') {
            btn.disabled = false; btn.textContent = '✅ Approve & Upload →';
            const err = job.stderr || job.stdout || 'Upload failed';
            toast('Upload failed: ' + err.split('\n').pop(), 'err', 10000);
          }
          // if done — poll() will detect youtube_video_id and switch to done screen
        };
        setTimeout(checkJob, 3000);
      }
    } catch(e) {
      btn.disabled = false; btn.textContent = '✅ Approve & Upload →';
      toast('Upload error: ' + e.message, 'err', 8000);
    }
  });
}

// ── New video modal ────────────────────────────────────────────────
function showNewVideoModal() {
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:300;display:flex;align-items:center;justify-content:center;padding:20px';
  overlay.innerHTML = `<div style="background:#fff;border-radius:14px;padding:28px;width:100%;max-width:460px;box-shadow:0 8px 32px rgba(0,0,0,.18)">
    <h2 style="font-size:18px;font-weight:800;margin-bottom:6px">New video</h2>
    <p style="font-size:13px;color:#6b7280;margin-bottom:20px">Give it a working title. You'll brainstorm and write the script in the next step.</p>
    <div class="field">
      <label>Working title</label>
      <input type="text" id="new-title" placeholder="e.g. Why We Procrastinate" autofocus>
    </div>
    <div class="btn-row" style="margin-top:0">
      <button class="btn-secondary" id="cancel-new">Cancel</button>
      <button class="btn-green" id="confirm-new" style="flex:1">Create project →</button>
    </div>
  </div>`;
  document.body.appendChild(overlay);
  setTimeout(() => document.getElementById('new-title')?.focus(), 50);

  overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });
  document.getElementById('cancel-new').addEventListener('click', () => overlay.remove());
  document.getElementById('confirm-new').addEventListener('click', async () => {
    const title = document.getElementById('new-title').value.trim();
    if (!title) return;
    const btn = document.getElementById('confirm-new');
    btn.disabled = true; btn.textContent = 'Creating…';
    const r = await api('/api/projects/create', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ title }),
    });
    if (r.ok) {
      overlay.remove();
      openProject(r.project.id);
    } else {
      alert('Error: ' + (r.error||'unknown'));
      btn.disabled = false; btn.textContent = 'Create project →';
    }
  });

  document.getElementById('new-title').addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('confirm-new').click();
  });
}

// ── Open project ───────────────────────────────────────────────────
async function openProject(id) {
  APP.screen = 'detail'; APP.activeId = id;
  APP.selectedThumb = null; APP.chatMsgs = [];
  APP.scriptMode = 'idle'; APP.transMode = 'idle';
  APP.scriptContent = null; APP.transContent = null;
  APP.pickedStyleId = ''; APP.pickedStyleLabel = '';
  const d = await api(`/api/projects/${id}`);
  APP.detail = d;
  const st = d.status;
  APP.detailStep =
    st === 'script' ? 1 :
    st === 'upload' ? 2 :
    st === 'style'  ? 3 : 4;
  render();
}

// ── Queue ──────────────────────────────────────────────────────────
async function startQueue(btn) {
  if (btn) { btn.disabled = true; btn.textContent = 'Starting…'; }
  try {
    const r = await api('/api/queue/start', { method: 'POST' });
    if (r.already_running) {
      toast('Queue is already running', 'ok');
    } else {
      toast('✅ Queue started!', 'ok', 4000);
    }
    APP.queueRunning = true;
    APP.showQueueLog = true;
    // fetch log immediately
    const ql = await api('/api/queue/log');
    APP.queueLog = ql.lines || [];
  } catch(e) {
    toast('Failed to start queue: ' + e.message, 'err');
    if (btn) { btn.disabled = false; btn.textContent = '▶ Start queue'; }
  }
  render();
}

function update_project_queue_status_local(id, status) {
  const p = APP.projects.find(p => p.id === id);
  if (p) p.status = status;
  if (APP.detail && APP.detail.id === id) APP.detail.status = status;
}

// ── Utils ──────────────────────────────────────────────────────────
function fmtChars(n) { return n >= 1000 ? (n/1000).toFixed(1)+'k chars' : n+' chars'; }
function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

let toastTimer = null;
function toast(msg, type = 'ok', ms = 3000) {
  const el = document.getElementById('toast');
  if (!el) return;
  el.textContent = msg;
  el.className = `toast ${type} show`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.classList.remove('show'); }, ms);
}

function showSupabaseSetup() {
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `<div class="modal" style="max-width:460px">
    <h2 style="margin-bottom:10px;font-size:16px">☁️ Connect Supabase</h2>
    <p style="color:#6b7280;font-size:13px;margin-bottom:16px">
      Paste your <strong>Personal Access Token</strong> from
      <a href="https://supabase.com/dashboard/account/tokens" target="_blank" style="color:#4b7cf6">supabase.com/dashboard/account/tokens</a>.
      Everything else is fetched automatically.
    </p>
    <label style="font-size:13px;font-weight:600;display:block;margin-bottom:6px">Personal Access Token (sbp_…)</label>
    <input id="sb-pat" type="password" placeholder="sbp_…"
      style="width:100%;padding:8px 10px;border:1px solid #d1d5db;border-radius:6px;font-size:13px;margin-bottom:16px;font-family:monospace">
    <div style="display:flex;gap:10px;justify-content:flex-end">
      <button id="sb-cancel" style="background:#f3f4f6;border:none;border-radius:6px;padding:8px 16px;cursor:pointer;font-size:13px">Cancel</button>
      <button id="sb-save" style="background:#16a34a;color:#fff;border:none;border-radius:6px;padding:8px 16px;cursor:pointer;font-size:13px;font-weight:600">Connect →</button>
    </div>
  </div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });
  document.getElementById('sb-cancel').addEventListener('click', () => overlay.remove());
  document.getElementById('sb-save').addEventListener('click', async () => {
    const pat = document.getElementById('sb-pat').value.trim();
    if (!pat) { toast('Paste your access token', 'err'); return; }
    const btn = document.getElementById('sb-save');
    btn.disabled = true; btn.textContent = 'Connecting…';
    const r = await api('/api/supabase/save-config', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ pat }),
    });
    if (r.ok) {
      overlay.remove();
      APP.supabase = { configured: true, url: r.url };
      toast('✅ Supabase connected — ' + (r.project || ''), 'ok', 5000);
      render();
    } else {
      toast('Error: ' + (r.error || 'unknown'), 'err', 6000);
      btn.disabled = false; btn.textContent = 'Connect →';
    }
  });
}

// ── Boot ───────────────────────────────────────────────────────────
if (new URLSearchParams(location.search).get('yt_auth') === 'ok') {
  history.replaceState({}, '', '/');
  api('/api/youtube/auth/status').then(s => { APP.ytAuth = s; render(); });
  toast('✅ YouTube connected!', 'ok', 5000);
}
poll();
