<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bendover Productions Studio</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:           #f5f4f1;
  --surface:      #ffffff;
  --surface-2:    #faf9f7;
  --surface-3:    #f0eeeb;
  --border:       #e4e1db;
  --border-2:     #ccc9c2;
  --text:         #1c1917;
  --text-2:       #44403c;
  --muted:        #78716c;
  --muted-2:      #a8a29e;
  --accent:       #7c3aed;
  --accent-2:     #6d28d9;
  --accent-soft:  #f5f3ff;
  --accent-mid:   #ddd6fe;
  --accent-text:  #5b21b6;
  --green:        #059669;
  --green-soft:   #ecfdf5;
  --green-mid:    #a7f3d0;
  --green-text:   #065f46;
  --red:          #dc2626;
  --red-soft:     #fef2f2;
  --red-mid:      #fecaca;
  --red-text:     #991b1b;
  --amber:        #d97706;
  --amber-soft:   #fffbeb;
  --amber-mid:    #fde68a;
  --amber-text:   #92400e;
  --shadow-xs:    0 1px 2px rgba(0,0,0,.06);
  --shadow-sm:    0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.04);
  --shadow-md:    0 4px 16px rgba(0,0,0,.07), 0 1px 4px rgba(0,0,0,.04);
  --shadow-lg:    0 8px 32px rgba(0,0,0,.09), 0 2px 8px rgba(0,0,0,.05);
  --r:            12px;
  --r-sm:         8px;
  --r-xs:         5px;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif;
  font-size: 14px;
  line-height: 1.5;
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ── Header ─────────────────────────────────────────────────────────────────── */
#header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0 20px;
  height: 56px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
  z-index: 10;
  box-shadow: 0 1px 0 var(--border), var(--shadow-xs);
}
#header-left { display: flex; align-items: center; gap: 10px; }
#logo-mark {
  width: 28px; height: 28px; border-radius: 7px;
  background: linear-gradient(135deg, var(--accent), #a855f7);
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: 14px; font-weight: 800; flex-shrink: 0;
  box-shadow: 0 2px 6px rgba(124,58,237,.35);
}
#header-left h1 {
  font-size: 14px; font-weight: 700; letter-spacing: -0.3px; color: var(--text);
}
#header-left .tagline {
  font-size: 11px; color: var(--muted-2);
  background: var(--surface-3); border: 1px solid var(--border);
  border-radius: 20px; padding: 2px 8px;
}

/* Credits widget */
#credits-widget { display: flex; align-items: center; gap: 6px; }

.credit-pill {
  display: flex; align-items: center; gap: 8px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  padding: 5px 11px;
  font-size: 12px; min-width: 155px;
  transition: border-color 0.2s, background 0.2s;
}
.credit-pill.stale { border-color: var(--amber-mid); background: var(--amber-soft); }
.credit-pill .cp-label {
  color: var(--muted); font-weight: 700; font-size: 10px;
  letter-spacing: 0.5px; text-transform: uppercase; white-space: nowrap; min-width: 22px;
}
.credit-pill .cp-bar-wrap {
  flex: 1; height: 4px; background: var(--border); border-radius: 2px; overflow: hidden;
}
.credit-pill .cp-bar { height: 100%; border-radius: 2px; transition: width 0.6s ease; }
.credit-pill .cp-pct { font-weight: 800; font-size: 12px; min-width: 34px; text-align: right; }
.credit-pill .cp-sub { color: var(--muted-2); font-size: 10px; white-space: nowrap; }

#credits-refresh {
  border: 1px solid var(--border); background: var(--surface);
  color: var(--muted); border-radius: var(--r-xs);
  padding: 5px 8px; cursor: pointer; font-size: 14px; line-height: 1;
  transition: all 0.15s;
}
#credits-refresh:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
#credits-refresh.spinning { animation: spin 0.8s linear infinite; }

/* ── Layout ─────────────────────────────────────────────────────────────────── */
#layout { display: flex; flex: 1; overflow: hidden; }

/* Sidebar */
#sidebar {
  width: 256px; background: var(--surface);
  border-right: 1px solid var(--border);
  overflow-y: auto; flex-shrink: 0; display: flex; flex-direction: column;
}
#sidebar-head {
  padding: 14px 16px 12px; border-bottom: 1px solid var(--border); flex-shrink: 0;
}
#sidebar-head h2 {
  font-size: 10px; font-weight: 700; color: var(--muted);
  letter-spacing: 0.8px; text-transform: uppercase;
}
#project-list { padding: 4px 8px; }

.proj-item {
  padding: 10px 10px; cursor: pointer;
  border-radius: var(--r-sm); margin: 2px 0;
  display: flex; flex-direction: column; gap: 5px;
  transition: background 0.1s; border: 1px solid transparent;
}
.proj-item:hover { background: var(--surface-2); }
.proj-item.active {
  background: var(--accent-soft); border-color: var(--accent-mid);
}
.proj-item .proj-name {
  font-size: 13px; font-weight: 600;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  color: var(--text);
}
.proj-item.active .proj-name { color: var(--accent-text); }

/* Badges */
.badge {
  display: inline-flex; align-items: center; gap: 4px;
  border-radius: 20px; padding: 2px 8px;
  font-size: 10px; font-weight: 700; letter-spacing: 0.2px; white-space: nowrap;
}
.badge-upload     { background: var(--surface-3); color: var(--muted); border: 1px solid var(--border); }
.badge-style      { background: #eff6ff; color: #1d4ed8; border: 1px solid #bfdbfe; }
.badge-queued     { background: var(--accent-soft); color: var(--accent-text); border: 1px solid var(--accent-mid); }
.badge-running    { background: var(--green-soft); color: var(--green-text); border: 1px solid var(--green-mid); }
.badge-thumbnails { background: var(--amber-soft); color: var(--amber-text); border: 1px solid var(--amber-mid); }
.badge-done       { background: var(--green-soft); color: var(--green-text); border: 1px solid var(--green-mid); }
.badge-failed     { background: var(--red-soft); color: var(--red-text); border: 1px solid var(--red-mid); }
.badge-paused     { background: var(--accent-soft); color: var(--accent-text); border: 1px solid var(--accent-mid); }
.badge-dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; display: inline-block; }
.badge-running .badge-dot { animation: pulse 1.4s ease infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }

/* ── Main ───────────────────────────────────────────────────────────────────── */
#main { flex: 1; overflow-y: auto; padding: 32px 36px; }
#main.empty {
  display: flex; align-items: center; justify-content: center;
  color: var(--muted); text-align: center;
}

.page-title {
  font-size: 24px; font-weight: 800; letter-spacing: -0.6px;
  margin-bottom: 8px; color: var(--text); line-height: 1.25;
}
.page-meta { display: flex; align-items: center; gap: 8px; margin-bottom: 28px; }

/* Step bar */
.step-bar { display: flex; align-items: center; margin-bottom: 28px; }
.step-node { display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600; }
.step-node .dot {
  width: 22px; height: 22px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 10px; font-weight: 800; flex-shrink: 0;
  transition: all 0.2s;
}
.step-node.done .dot   { background: var(--green); color: #fff; }
.step-node.active .dot { background: var(--accent); color: #fff; box-shadow: 0 0 0 4px var(--accent-mid); }
.step-node.idle .dot   { background: var(--surface-3); color: var(--muted-2); border: 1px solid var(--border); }
.step-node .label { color: var(--muted); font-size: 11px; }
.step-node.active .label { color: var(--accent); }
.step-node.done .label { color: var(--green-text); }
.step-line { flex: 1; height: 2px; background: var(--border); margin: 0 8px; min-width: 16px; border-radius: 1px; }
.step-line.done { background: var(--green); }

/* Cards */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 24px;
  margin-bottom: 16px;
  box-shadow: var(--shadow-sm);
}
.card-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 18px;
}
.card-title {
  font-size: 11px; font-weight: 700; color: var(--muted);
  letter-spacing: 0.7px; text-transform: uppercase;
}
.card-desc {
  color: var(--muted); font-size: 13px; margin-bottom: 20px; line-height: 1.6;
}

/* Upload zones */
.upload-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.upload-zone {
  border: 2px dashed var(--border);
  border-radius: var(--r-sm);
  padding: 32px 20px;
  text-align: center; cursor: pointer;
  transition: all 0.2s;
  position: relative; background: var(--surface-2);
}
.upload-zone:hover, .upload-zone.drag {
  border-color: var(--accent); background: var(--accent-soft);
}
.upload-zone.done {
  border-color: var(--green); border-style: solid; background: var(--green-soft);
}
.upload-zone input[type=file] {
  position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%;
}
.upload-zone .icon { font-size: 28px; margin-bottom: 10px; display: block; }
.upload-zone .uz-label { font-size: 13px; color: var(--muted); line-height: 1.5; }
.upload-zone .uz-done  { font-size: 13px; font-weight: 600; color: var(--green); }
.field-label {
  font-size: 11px; color: var(--muted); font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.5px;
  margin-bottom: 7px; margin-top: 16px;
}

/* Style grid */
.style-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 10px; margin-bottom: 12px;
}
.style-card {
  background: var(--surface-2); border: 2px solid var(--border);
  border-radius: var(--r-sm); padding: 10px; cursor: pointer;
  transition: all 0.15s;
}
.style-card:hover { border-color: var(--accent-mid); background: var(--accent-soft); }
.style-card.selected {
  border-color: var(--accent); background: var(--accent-soft);
  box-shadow: 0 0 0 3px var(--accent-mid);
}
.style-preview {
  width: 100%; aspect-ratio: 16/9;
  background: var(--surface-3); border-radius: var(--r-xs);
  margin-bottom: 8px; overflow: hidden;
}
.style-preview img { width: 100%; height: 100%; object-fit: cover; }
.style-label     { font-size: 12px; font-weight: 600; color: var(--text); }
.style-label-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }

#custom-panel { display: none; margin-top: 14px; border-top: 1px solid var(--border); padding-top: 16px; }
#custom-panel.open { display: block; }

textarea {
  width: 100%; background: var(--surface-2);
  border: 1px solid var(--border); border-radius: var(--r-sm);
  color: var(--text); padding: 10px 13px;
  font-size: 13px; font-family: inherit;
  resize: vertical; outline: none;
  transition: border-color 0.15s, box-shadow 0.15s; line-height: 1.6;
}
textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-mid); background: #fff; }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 9px 18px; border-radius: var(--r-sm);
  font-size: 13px; font-weight: 600; cursor: pointer; border: none;
  transition: all 0.15s; white-space: nowrap; text-decoration: none; letter-spacing: -0.1px;
}
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover:not(:disabled) {
  background: var(--accent-2); box-shadow: 0 4px 14px rgba(124,58,237,.35);
  transform: translateY(-1px);
}
.btn-primary:active:not(:disabled) { transform: translateY(0); box-shadow: none; }
.btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-outline { background: var(--surface); color: var(--text-2); border: 1px solid var(--border); }
.btn-outline:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.btn-green { background: var(--green); color: #fff; }
.btn-green:hover { background: #047857; box-shadow: 0 4px 14px rgba(5,150,105,.3); }
.btn-red { background: var(--red); color: #fff; }
.btn-red:hover:not(:disabled) { background: #b91c1c; }
.btn-red:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-ghost { background: transparent; color: var(--muted); border: 1px solid transparent; }
.btn-ghost:hover { background: var(--surface-3); border-color: var(--border); color: var(--text); }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

/* Log viewer */
#log-box {
  background: #0f0f14;
  border: 1px solid #1e1e2a;
  border-radius: var(--r-sm);
  padding: 16px 18px;
  font-family: "SF Mono", "Fira Code", "Cascadia Code", ui-monospace, monospace;
  font-size: 11.5px; line-height: 1.7; color: #c9d1d9;
  height: 280px; overflow-y: auto;
  white-space: pre-wrap; word-break: break-all;
}
#log-box::-webkit-scrollbar { width: 6px; }
#log-box::-webkit-scrollbar-track { background: transparent; }
#log-box::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }

/* Progress */
.progress-wrap { margin-bottom: 8px; }
.progress-bar { height: 8px; background: var(--surface-3); border-radius: 4px; overflow: hidden; }
.progress-bar .fill {
  height: 100%; border-radius: 4px; transition: width 0.6s ease;
  background: linear-gradient(90deg, var(--accent) 0%, #a855f7 100%);
}
.progress-meta { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-top: 6px; }

/* Thumbnails */
.thumb-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 18px; }
.thumb-card {
  border: 2px solid var(--border); border-radius: var(--r-sm);
  overflow: hidden; cursor: pointer; transition: all 0.18s;
  background: var(--surface); box-shadow: var(--shadow-xs);
}
.thumb-card:hover {
  border-color: var(--accent); box-shadow: var(--shadow-md);
  transform: translateY(-2px);
}
.thumb-card.selected {
  border-color: var(--green); box-shadow: 0 0 0 3px var(--green-mid);
  transform: translateY(-2px);
}
.thumb-card img { width: 100%; display: block; }
.thumb-foot {
  padding: 10px; display: flex; justify-content: center;
  background: var(--surface-2); border-top: 1px solid var(--border);
}
.thumb-empty {
  display: flex; align-items: center; justify-content: center;
  min-height: 110px; color: var(--muted-2); font-size: 12px;
  background: var(--surface-2); border: 1px dashed var(--border); border-radius: var(--r-sm);
}

/* Alerts */
.alert {
  padding: 12px 15px; border-radius: var(--r-sm);
  font-size: 13px; margin-bottom: 16px; line-height: 1.5;
}
.alert-red    { background: var(--red-soft);   border: 1px solid var(--red-mid);   color: var(--red-text); }
.alert-green  { background: var(--green-soft); border: 1px solid var(--green-mid); color: var(--green-text); }
.alert-amber  { background: var(--amber-soft); border: 1px solid var(--amber-mid); color: var(--amber-text); }
.alert-purple { background: var(--accent-soft); border: 1px solid var(--accent-mid); color: var(--accent-text); }

/* Preflight output */
#preflight-out {
  background: #0f0f14; border: 1px solid #1e1e2a; border-radius: var(--r-sm);
  padding: 12px 14px; font-family: ui-monospace, monospace; font-size: 11.5px; color: #c9d1d9;
  white-space: pre-wrap; max-height: 200px; overflow-y: auto; margin-top: 14px; display: none;
}

/* Spinner */
@keyframes spin { to { transform: rotate(360deg); } }
.spinner {
  width: 16px; height: 16px;
  border: 2px solid var(--border); border-top-color: var(--accent);
  border-radius: 50%; animation: spin 0.7s linear infinite; flex-shrink: 0;
}

/* Info row */
.info-row { display: flex; gap: 28px; margin-bottom: 18px; }
.info-item { display: flex; flex-direction: column; gap: 3px; }
.info-item .ii-label {
  font-size: 10px; color: var(--muted); font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.5px;
}
.info-item .ii-value { font-size: 14px; font-weight: 600; color: var(--text); }

/* Divider */
.divider { border: none; border-top: 1px solid var(--border); margin: 18px 0; }

/* Stat block (for running view) */
.stat-row { display: flex; gap: 16px; margin-bottom: 20px; }
.stat-block {
  flex: 1; background: var(--surface-2); border: 1px solid var(--border);
  border-radius: var(--r-sm); padding: 14px 16px;
}
.stat-block .sb-val { font-size: 26px; font-weight: 800; color: var(--text); letter-spacing: -1px; }
.stat-block .sb-lbl { font-size: 11px; color: var(--muted); margin-top: 2px; font-weight: 500; }

a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

/* Empty state */
.empty-state { text-align: center; }
.empty-state .es-icon {
  width: 56px; height: 56px; background: var(--accent-soft);
  border: 1px solid var(--accent-mid); border-radius: 14px;
  display: flex; align-items: center; justify-content: center;
  font-size: 26px; margin: 0 auto 16px;
}
.empty-state h2 { font-size: 16px; font-weight: 700; margin-bottom: 6px; color: var(--text); }
.empty-state p { color: var(--muted); font-size: 13px; line-height: 1.6; }

/* Running pulse ring */
.pulse-ring {
  width: 10px; height: 10px; border-radius: 50%;
  background: var(--green); display: inline-block; position: relative;
}
.pulse-ring::after {
  content: ''; position: absolute; inset: -3px; border-radius: 50%;
  border: 2px solid var(--green); animation: ring 1.6s ease-out infinite;
}
@keyframes ring { 0%{opacity:1;transform:scale(1)} 100%{opacity:0;transform:scale(2.2)} }

/* ── Frame Viewer ────────────────────────────────────────────────────────────*/
.viewer-wrap {
  position: relative; background: #000; border-radius: var(--r-sm);
  overflow: hidden; aspect-ratio: 16/9; margin-bottom: 0;
}
.viewer-wrap img {
  width: 100%; height: 100%; object-fit: contain; display: block;
  transition: opacity 0.25s ease;
}
.viewer-wrap.loading img { opacity: 0.5; }
.viewer-caption {
  position: absolute; bottom: 0; left: 0; right: 0;
  background: linear-gradient(transparent, rgba(0,0,0,0.82));
  color: #fff; padding: 32px 18px 14px;
  font-size: 13px; line-height: 1.55; font-weight: 500;
  pointer-events: none;
}
.viewer-live-badge {
  position: absolute; top: 10px; right: 10px;
  background: #ef4444; color: #fff;
  font-size: 10px; font-weight: 800; letter-spacing: 0.5px;
  padding: 3px 8px; border-radius: 4px; text-transform: uppercase;
  display: flex; align-items: center; gap: 5px;
}
.viewer-live-badge .live-dot {
  width: 6px; height: 6px; border-radius: 50%; background: #fff;
  animation: pulse 1s ease infinite;
}
.viewer-placeholder {
  width: 100%; height: 100%; display: flex; align-items: center;
  justify-content: center; color: #555; font-size: 13px;
  background: #0a0a0f;
}
.viewer-controls {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 0 2px; flex-wrap: wrap;
}
.viewer-btn {
  background: var(--surface-3); border: 1px solid var(--border);
  border-radius: var(--r-xs); padding: 6px 12px; cursor: pointer;
  font-size: 13px; font-weight: 600; color: var(--text-2);
  transition: all 0.12s; line-height: 1;
}
.viewer-btn:hover { background: var(--accent-soft); border-color: var(--accent-mid); color: var(--accent); }
.viewer-btn:disabled { opacity: 0.35; cursor: not-allowed; }
.viewer-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
.viewer-count { font-size: 13px; color: var(--muted); font-weight: 600; white-space: nowrap; }
.viewer-time  { font-size: 12px; color: var(--muted-2); font-variant-numeric: tabular-nums; }
.viewer-spacer { flex: 1; }

.audio-bar-wrap {
  margin-top: 10px; position: relative; height: 5px;
  background: var(--surface-3); border-radius: 3px; cursor: pointer;
}
.audio-bar-fill {
  height: 100%; background: var(--accent); border-radius: 3px;
  pointer-events: none; transition: width 0.5s linear;
}
.audio-bar-wrap:hover .audio-bar-fill { background: var(--accent-2); }
</style>
</head>
<body>

<!-- ── Header ──────────────────────────────────────────────────────────────── -->
<div id="header">
  <div id="header-left">
    <div id="logo-mark">B</div>
    <h1>Bendover Studio</h1>
    <span class="tagline">local</span>
  </div>
  <div id="credits-widget">
    <div class="credit-pill" id="cp-5h" title="5-hour generation window">
      <span class="cp-label">5h</span>
      <div class="cp-bar-wrap"><div class="cp-bar" id="bar-5h" style="width:0%"></div></div>
      <span class="cp-pct" id="pct-5h">—</span>
      <span class="cp-sub" id="sub-5h"></span>
    </div>
    <div class="credit-pill" id="cp-wk" title="Weekly generation window">
      <span class="cp-label">Wkly</span>
      <div class="cp-bar-wrap"><div class="cp-bar" id="bar-wk" style="width:0%"></div></div>
      <span class="cp-pct" id="pct-wk">—</span>
      <span class="cp-sub" id="sub-wk"></span>
    </div>
    <button id="credits-refresh" onclick="refreshCredits()" title="Refresh credits (runs codex to get live data)">↻</button>
  </div>
</div>

<!-- ── Layout ─────────────────────────────────────────────────────────────── -->
<div id="layout">

  <aside id="sidebar">
    <div id="sidebar-head"><h2>Projects</h2></div>
    <div id="project-list">
      <div style="padding:16px 12px;color:var(--muted-2);font-size:12px">Loading…</div>
    </div>
  </aside>

  <main id="main" class="empty">
    <div class="empty-state">
      <div class="es-icon">🎬</div>
      <h2>Select a project</h2>
      <p>Pick one from the sidebar, or create<br>new ones via Claude Code <code>/start</code></p>
    </div>
  </main>

</div>

<script>
'use strict';

// ── State ──────────────────────────────────────────────────────────────────────
let selectedId   = null;
let projects     = [];
let currentProj  = null;
let logTimer     = null;
let stylePresets = [];
let selectedPreset = null;

const STATUS_LABELS = {
  upload:     'Upload files',
  style:      'Choose style',
  queued:     'In queue',
  running:    'Generating',
  thumbnails: 'Pick thumbnail',
  done:       'Done',
  failed:     'Failed',
  paused:     'Paused',
};
const STEPS = ['upload','style','queued','running','thumbnails','done'];

// ── Boot ───────────────────────────────────────────────────────────────────────
(async () => {
  stylePresets = await get('/api/styles').catch(() => []);
  await refreshProjects();
  setInterval(refreshProjects, 3000);
  loadCredits();
  setInterval(loadCredits, 30000);
})();

// ── Helpers ───────────────────────────────────────────────────────────────────
async function get(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}
async function post(url, data) {
  const r = await fetch(url, { method:'POST', headers:{'Content-Type':'application/json'}, body: data !== undefined ? JSON.stringify(data) : undefined });
  return r.json();
}
async function upload(url, field, file) {
  const fd = new FormData();
  fd.append(field, file, file.name);
  return (await fetch(url, { method:'POST', body: fd })).json();
}
function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Credits ───────────────────────────────────────────────────────────────────
async function loadCredits() {
  try {
    const d = await get('/api/credits');
    renderCredits(d);
  } catch(e) {}
}

async function refreshCredits() {
  const btn = document.getElementById('credits-refresh');
  btn.classList.add('spinning');
  try {
    const d = await get('/api/credits?force=1');
    renderCredits(d);
  } catch(e) {}
  setTimeout(() => btn.classList.remove('spinning'), 800);
}

function renderCredits(d) {
  const ageSeconds = d.event_age_seconds || 0;
  const ageStr = fmtAge(ageSeconds);
  const isStale = !d.credits_fresh;
  renderCreditPill('5h', d.five_hour, isStale, ageStr);
  renderCreditPill('wk', d.weekly,    isStale, ageStr);
}

function fmtAge(secs) {
  if (!secs || secs < 60) return 'just now';
  if (secs < 3600) return Math.round(secs / 60) + 'm ago';
  if (secs < 86400) return Math.round(secs / 3600) + 'h ago';
  return Math.round(secs / 86400) + 'd ago';
}

function renderCreditPill(key, w, isStale, ageStr) {
  if (!w) return;
  const pill  = document.getElementById('cp-' + key);
  const bar   = document.getElementById('bar-' + key);
  const pctEl = document.getElementById('pct-' + key);
  const subEl = document.getElementById('sub-' + key);

  if (w.window_reset) {
    if (pill)  pill.classList.add('stale');
    if (bar)   { bar.style.width = '0%'; bar.className = 'cp-bar'; }
    if (pctEl) { pctEl.textContent = '?'; pctEl.style.cssText = 'color:var(--muted);font-weight:800'; }
    if (subEl) subEl.textContent = 'reset · click ↻';
    return;
  }

  const pct   = Math.round(parseFloat(w.remaining_percent || 0));
  const color = pct > 50 ? '#10b981' : pct > 20 ? '#f59e0b' : '#ef4444';
  if (pill)  pill.classList.toggle('stale', isStale);
  if (bar)   { bar.style.width = pct + '%'; bar.style.background = color; bar.className = 'cp-bar'; }
  if (pctEl) { pctEl.textContent = pct + '%'; pctEl.style.cssText = `color:${color};font-weight:800`; }
  if (subEl) {
    subEl.textContent = isStale
      ? ageStr
      : (w.reset_in ? 'resets ' + w.reset_in : '');
  }
}

// ── Project list ───────────────────────────────────────────────────────────────
async function refreshProjects() {
  try {
    const fresh = await get('/api/projects');
    if (JSON.stringify(fresh) !== JSON.stringify(projects)) {
      projects = fresh;
      renderSidebar();
    }
    if (selectedId) refreshProject();
  } catch(e) {}
}

function renderSidebar() {
  const el = document.getElementById('project-list');
  if (!projects.length) {
    el.innerHTML = '<div style="padding:16px 12px;color:var(--muted-2);font-size:12px;line-height:1.6">No projects yet.<br>Run <code>/start</code> in Claude Code.</div>';
    return;
  }
  el.innerHTML = projects.map(p => `
    <div class="proj-item${p.id === selectedId ? ' active' : ''}" onclick="selectProject('${esc(p.id)}')">
      <div class="proj-name">${esc(p.title || p.id)}</div>
      <div><span class="badge badge-${p.status||'upload'}">${badgeDot(p.status)}<span>${STATUS_LABELS[p.status]||p.status}</span></span></div>
    </div>
  `).join('');
}

function badgeDot(s) {
  return s === 'running' ? '<span class="badge-dot"></span>' : '';
}

// ── Project detail ─────────────────────────────────────────────────────────────
function selectProject(id) {
  selectedId = id;
  clearInterval(logTimer); logTimer = null;
  clearInterval(vPollTimer); vPollTimer = null;
  const audio = document.getElementById('viewer-audio');
  if (audio) { audio.pause(); audio.src = ''; }
  currentProj = null;
  renderSidebar();
  const main = document.getElementById('main');
  main.classList.remove('empty');
  main.innerHTML = '<div style="padding:60px;color:var(--muted-2);text-align:center;font-size:13px">Loading…</div>';
  refreshProject();
}

async function refreshProject() {
  if (!selectedId) return;
  try {
    const p = await get('/api/project/' + selectedId);
    const sig = JSON.stringify(p);
    if (!currentProj || JSON.stringify(currentProj) !== sig) {
      currentProj = p;
      renderDetail(p);
    }
  } catch(e) {}
}

function stepState(status, stepName) {
  const idx  = STEPS.indexOf(status);
  const sIdx = STEPS.indexOf(stepName);
  if (sIdx < idx) return 'done';
  if (sIdx === idx) return 'active';
  return 'idle';
}

function renderDetail(p) {
  const status    = p.queue_status || 'upload';
  const stepNames = ['Upload', 'Style', 'Queue', 'Generate', 'Thumbnail', 'Done'];

  const stepBar = STEPS.map((s, i) => {
    const state   = stepState(status, s);
    const isDone  = state === 'done';
    const line    = i < STEPS.length - 1 ? `<div class="step-line${isDone ? ' done' : ''}"></div>` : '';
    return `
      <div class="step-node ${state}">
        <div class="dot">${isDone ? '✓' : i+1}</div>
        <span class="label">${stepNames[i]}</span>
      </div>${line}`;
  }).join('');

  const showStepBar = !['running','queued','paused','failed','thumbnails','done'].includes(status);

  document.getElementById('main').innerHTML = `
    <div class="page-title">${esc(p.name || p.title || p.id)}</div>
    <div class="page-meta">
      <span class="badge badge-${status}">${badgeDot(status)}<span>${STATUS_LABELS[status]||status}</span></span>
    </div>
    ${showStepBar ? `<div class="step-bar">${stepBar}</div>` : ''}
    <div id="step-content"></div>
  `;

  const el = document.getElementById('step-content');
  if (status === 'upload')          renderUpload(p, el);
  else if (status === 'style')      renderStyle(p, el);
  else if (status === 'queued')     renderQueued(el);
  else if (status === 'running')    renderRunning(p, el);
  else if (status === 'paused')     renderPaused(p, el);
  else if (status === 'thumbnails') renderThumbnails(p, el);
  else if (status === 'done')       renderDone(p, el);
  else if (status === 'failed')     renderFailed(el);
}

// ── Upload ────────────────────────────────────────────────────────────────────
function renderUpload(p, el) {
  const both = p.audio_ok && p.transcript_ok;
  el.innerHTML = `
    <div class="card">
      <div class="card-header"><div class="card-title">Step 1 — Upload Files</div></div>
      <p class="card-desc">Upload narration audio and your TurboScribe transcript. The page advances automatically once both are ready.</p>
      <div class="upload-grid">
        <div>
          <div class="field-label" style="margin-top:0">Narration audio</div>
          <div class="upload-zone${p.audio_ok?' done':''}" id="audio-zone"
               ondragover="dz(event)" ondragleave="dzl(event)" ondrop="dropAudio(event)">
            <input type="file" accept=".mp3,.wav,.m4a" onchange="handleAudio(this.files[0])">
            <span class="icon">${p.audio_ok ? '✅' : '🎙️'}</span>
            <div id="audio-lbl" class="${p.audio_ok ? 'uz-done' : 'uz-label'}">
              ${p.audio_ok ? 'Audio ready' : '<strong style="display:block;margin-bottom:3px;color:var(--text-2)">Drop .mp3 or .wav</strong>or click to browse'}
            </div>
          </div>
        </div>
        <div>
          <div class="field-label" style="margin-top:0">TurboScribe transcript</div>
          <div class="upload-zone${p.transcript_ok?' done':''}" id="tx-zone"
               ondragover="dz(event)" ondragleave="dzl(event)" ondrop="dropTx(event)">
            <input type="file" accept=".txt" onchange="handleTx(this.files[0])">
            <span class="icon">${p.transcript_ok ? '✅' : '📝'}</span>
            <div id="tx-lbl" class="${p.transcript_ok ? 'uz-done' : 'uz-label'}">
              ${p.transcript_ok ? 'Transcript ready' : '<strong style="display:block;margin-bottom:3px;color:var(--text-2)">Drop .txt file</strong>or click to browse'}
            </div>
          </div>
        </div>
      </div>
      <div style="margin-top:14px;display:flex;align-items:center;gap:10px">
        <div style="flex:1;height:4px;background:var(--surface-3);border-radius:2px;overflow:hidden">
          <div style="height:100%;width:${((p.audio_ok?1:0)+(p.transcript_ok?1:0))*50}%;background:var(--accent);border-radius:2px;transition:width 0.4s"></div>
        </div>
        <span style="font-size:12px;color:var(--muted);white-space:nowrap">
          ${(p.audio_ok?1:0)+(p.transcript_ok?1:0)}/2 ready${both?' · moving to style…':''}
        </span>
      </div>
    </div>
  `;
}
function dz(e) { e.preventDefault(); e.currentTarget.classList.add('drag'); }
function dzl(e) { e.currentTarget.classList.remove('drag'); }
function dropAudio(e) { e.preventDefault(); e.currentTarget.classList.remove('drag'); handleAudio(e.dataTransfer.files[0]); }
function dropTx(e)    { e.preventDefault(); e.currentTarget.classList.remove('drag'); handleTx(e.dataTransfer.files[0]); }
async function handleAudio(file) {
  if (!file||!selectedId) return;
  lbl('audio', '⏳ Uploading…');
  const r = await upload('/api/project/'+selectedId+'/upload-audio','file',file);
  if (r.ok) refreshProject(); else lbl('audio','❌ '+(r.error||'Failed'));
}
async function handleTx(file) {
  if (!file||!selectedId) return;
  lbl('tx', '⏳ Uploading…');
  const r = await upload('/api/project/'+selectedId+'/upload-transcript','file',file);
  if (r.ok) refreshProject(); else lbl('tx','❌ '+(r.error||'Failed'));
}
function lbl(zone, text) { const el = document.getElementById(zone+'-lbl'); if(el) el.textContent = text; }

// ── Style ──────────────────────────────────────────────────────────────────────
function renderStyle(p, el) {
  selectedPreset = p.style_preset_id || null;
  const hasStyle = p.image_style && p.image_style.length > 10;

  const cards = stylePresets.map(s => {
    const imgName = s.preview ? s.preview.split('/').pop() : null;
    return `
      <div class="style-card${selectedPreset===s.id?' selected':''}" id="ps-${esc(s.id)}" onclick="pickPreset('${esc(s.id)}')">
        <div class="style-preview">${imgName?`<img src="/assets/style-samples/${imgName}" onerror="this.style.display='none'">`:''}</div>
        <div class="style-label">${esc(s.label)}</div>
      </div>
    `;
  }).join('');

  el.innerHTML = `
    <div class="card">
      <div class="card-header"><div class="card-title">Step 2 — Visual Style</div></div>
      <p class="card-desc">Pick a preset look for the generated images, or define your own.</p>

      <div class="style-grid">${cards}</div>

      <div class="style-card${selectedPreset==='__custom__'?' selected':''}" id="ps-__custom__"
           onclick="pickCustom()" style="display:flex;align-items:center;gap:12px;padding:12px 16px;margin-bottom:2px">
        <span style="font-size:22px">✏️</span>
        <div>
          <div class="style-label">Custom style</div>
          <div class="style-label-sub">Write your own image prompt</div>
        </div>
      </div>

      <div id="custom-panel" class="${selectedPreset==='__custom__'||p.style_preset_id==='custom'?'open':''}">
        <div class="field-label" style="margin-top:0">Image style prompt <span style="color:var(--red)">*</span></div>
        <textarea id="f-style" rows="4" placeholder="e.g. flat vector, thick black outlines, bold primary colors, retro cartoon…">${p.style_preset_id==='custom'?esc(p.image_style||''):''}</textarea>
        <div class="field-label">Per-frame rules <span style="color:var(--muted-2)">(optional)</span></div>
        <textarea id="f-guide" rows="3" placeholder="- One concept per frame&#10;- No text in images">${esc(p.style_guide||'')}</textarea>
        <div class="field-label">Tone <span style="color:var(--muted-2)">(optional)</span></div>
        <textarea id="f-tone" rows="2" placeholder="e.g. Educational, dry humor">${esc(p.tone||'')}</textarea>
      </div>

      ${hasStyle && p.style_preset_id !== 'custom' ? `
        <div class="alert alert-purple" style="margin-top:14px;font-size:12px;margin-bottom:0">
          Current style: <strong>${esc(p.style_preset_label||p.style_preset_id||'set')}</strong> — change above or confirm below
        </div>` : ''}

      <hr class="divider">
      <div class="row">
        <button class="btn btn-primary" onclick="confirmStyle()">Confirm style →</button>
      </div>
    </div>
  `;
}

function pickPreset(id) {
  selectedPreset = id;
  document.querySelectorAll('.style-card').forEach(c => c.classList.remove('selected'));
  const c = document.getElementById('ps-'+id); if (c) c.classList.add('selected');
  const panel = document.getElementById('custom-panel'); if (panel) panel.classList.remove('open');
}
function pickCustom() {
  selectedPreset = '__custom__';
  document.querySelectorAll('.style-card').forEach(c => c.classList.remove('selected'));
  const c = document.getElementById('ps-__custom__'); if (c) c.classList.add('selected');
  const panel = document.getElementById('custom-panel'); if (panel) panel.classList.add('open');
}
async function confirmStyle() {
  if (!selectedId) return;
  const customStyle = document.getElementById('f-style')?.value?.trim()||'';
  const guide       = document.getElementById('f-guide')?.value?.trim()||'';
  const tone        = document.getElementById('f-tone')?.value?.trim()||'';
  if (!selectedPreset) { alert('Pick a style first.'); return; }
  if (selectedPreset==='__custom__' && !customStyle) { alert('Enter a custom style description.'); return; }
  const body = selectedPreset !== '__custom__'
    ? { preset_id: selectedPreset, style_guide: guide, tone }
    : { custom_style: customStyle, style_guide: guide, tone };
  const r = await post('/api/project/'+selectedId+'/set-style', body);
  if (r.ok) renderValidateCard();
  else alert('Error: '+(r.error||'Unknown'));
}

// ── Validate & Queue ───────────────────────────────────────────────────────────
function renderValidateCard() {
  const el = document.getElementById('step-content');
  if (!el) return;
  el.innerHTML = `
    <div class="card">
      <div class="card-header"><div class="card-title">Step 3 — Start Generation</div></div>
      <p class="card-desc">
        Runs a quick preflight check, then adds this project to the generation queue.
        Credits auto-pause and auto-resume — you'll get an ntfy ping when thumbnails are ready.
      </p>
      <div class="row">
        <button class="btn btn-primary" id="start-btn" onclick="startGeneration()">▶ Start Generation</button>
      </div>
      <pre id="preflight-out"></pre>
    </div>
  `;
}

async function startGeneration() {
  const btn = document.getElementById('start-btn');
  const pf  = document.getElementById('preflight-out');
  if (btn) { btn.disabled = true; btn.textContent = '⏳ Validating…'; }
  try {
    const r = await fetch('/api/project/'+selectedId+'/queue', { method:'POST' });
    const d = await r.json();
    if (d.ok) {
      if (pf && d.preflight) { pf.style.display='block'; pf.textContent=d.preflight; }
      await refreshProject();
    } else {
      if (btn) { btn.disabled=false; btn.textContent='▶ Start Generation'; }
      if (pf)  { pf.style.display='block'; pf.textContent=d.preflight||d.error||'Preflight failed.'; }
    }
  } catch(e) {
    if (btn) { btn.disabled=false; btn.textContent='▶ Start Generation'; }
  }
}

// ── Queued ────────────────────────────────────────────────────────────────────
function renderQueued(el) {
  el.innerHTML = `
    <div class="card">
      <div class="card-header"><div class="card-title">In Queue</div></div>
      <div class="row" style="gap:12px;padding:8px 0">
        <div class="spinner"></div>
        <div>
          <div style="font-weight:600;margin-bottom:3px">Waiting for the queue runner…</div>
          <div style="color:var(--muted);font-size:12px">One project runs at a time. Generation will start automatically.</div>
        </div>
      </div>
    </div>
  `;
}

// ── Running ───────────────────────────────────────────────────────────────────
function renderRunning(p, el) {
  const prog  = p.progress || {};
  const done  = prog.done || prog.completed || 0;
  const total = prog.total || 0;
  const pct   = total > 0 ? Math.round((done/total)*100) : 0;

  el.innerHTML = `
    <div class="card">
      <div class="card-header">
        <div style="display:flex;align-items:center;gap:10px">
          <div class="pulse-ring"></div>
          <div class="card-title" style="color:var(--green-text)">Generating</div>
        </div>
        <button class="btn btn-red" id="stop-btn" onclick="stopGeneration()" style="padding:6px 14px;font-size:12px">■ Stop</button>
      </div>

      ${total > 0 ? `
        <div class="stat-row" style="margin-bottom:14px">
          <div class="stat-block"><div class="sb-val">${done}</div><div class="sb-lbl">frames done</div></div>
          <div class="stat-block"><div class="sb-val">${total - done}</div><div class="sb-lbl">remaining</div></div>
          <div class="stat-block"><div class="sb-val">${pct}%</div><div class="sb-lbl">complete</div></div>
        </div>
        <div class="progress-bar" style="margin-bottom:0"><div class="fill" style="width:${pct}%"></div></div>
      ` : `
        <div style="color:var(--muted);font-size:13px;padding:2px 0 8px">Pipeline running — credits auto-pause &amp; resume if needed</div>
      `}
    </div>

    <div class="card" style="padding-bottom:18px">
      <div class="card-header" style="margin-bottom:12px">
        <div class="card-title">Live Preview</div>
        <div style="display:flex;gap:8px;align-items:center">
          <span id="viewer-mute-wrap"></span>
        </div>
      </div>

      <div class="viewer-wrap" id="viewer-wrap">
        <div class="viewer-placeholder" id="viewer-placeholder">Waiting for first image…</div>
        <img id="viewer-img" style="display:none" alt="">
        <div class="viewer-caption" id="viewer-caption" style="display:none"></div>
        <div class="viewer-live-badge" id="viewer-live-badge" style="display:none">
          <span class="live-dot"></span>LIVE
        </div>
      </div>

      <div class="audio-bar-wrap" id="audio-bar-wrap" onclick="audioSeekClick(event)" title="Click to seek">
        <div class="audio-bar-fill" id="audio-bar-fill" style="width:0%"></div>
      </div>

      <div class="viewer-controls">
        <button class="viewer-btn" id="vbtn-prev" onclick="viewerPrev()" title="Previous frame">◀</button>
        <span class="viewer-count" id="viewer-count">— / —</span>
        <button class="viewer-btn" id="vbtn-next" onclick="viewerNext()" title="Next frame">▶</button>
        <button class="viewer-btn" id="vbtn-play" onclick="viewerTogglePlay()" title="Play/Pause audio">▶ Play</button>
        <span class="viewer-time" id="viewer-time">0:00</span>
        <div class="viewer-spacer"></div>
        <button class="viewer-btn" id="vbtn-live" onclick="viewerGoLive()" title="Jump to latest">📡 Live</button>
      </div>

      <audio id="viewer-audio" preload="auto" style="display:none">
        <source src="/audio/${esc(selectedId)}" type="audio/mpeg">
      </audio>
    </div>

    <div class="card">
      <div class="card-header"><div class="card-title">Pipeline Log</div></div>
      <div id="log-box">Loading…</div>
    </div>
  `;

  viewerInit(selectedId);
  clearInterval(logTimer);
  pollLog();
  logTimer = setInterval(pollLog, 2500);
}

async function stopGeneration() {
  if (!selectedId) return;
  const btn = document.getElementById('stop-btn');
  if (btn) { btn.disabled=true; btn.textContent='Stopping…'; }
  try {
    const r = await post('/api/project/'+selectedId+'/stop');
    if (r.ok) {
      clearInterval(logTimer);
      await refreshProject();
    } else {
      if (btn) { btn.disabled=false; btn.textContent='■ Stop'; }
      alert('Error: '+(r.error||'Stop failed'));
    }
  } catch(e) {
    if (btn) { btn.disabled=false; btn.textContent='■ Stop'; }
  }
}

// ── Viewer ─────────────────────────────────────────────────────────────────────
let vFrames      = [];   // all frames from manifest
let vIdx         = 0;    // current frame index (into done frames)
let vDone        = [];   // frames that have images on disk
let vLive        = true; // auto-follow newest frame
let vProjId      = null;
let vPollTimer   = null;
let vAudioReady  = false;
let vMuted       = false;

function viewerInit(projId) {
  vProjId = projId;
  vFrames = []; vDone = []; vIdx = 0; vLive = true;
  clearInterval(vPollTimer);
  const audio = document.getElementById('viewer-audio');
  if (audio) {
    audio.addEventListener('timeupdate', viewerAudioTick);
    audio.addEventListener('canplay', () => { vAudioReady = true; });
  }
  viewerPoll();
  vPollTimer = setInterval(viewerPoll, 2500);
}

async function viewerPoll() {
  if (!vProjId) return;
  try {
    const data = await get('/api/project/' + vProjId + '/frames');
    const frames = data.frames || [];
    vFrames = frames;
    const prevDoneCount = vDone.length;
    vDone = frames.filter(f => f.exists);

    if (!vDone.length) return;

    // In live mode, always jump to the latest available frame
    if (vLive) {
      const newIdx = vDone.length - 1;
      if (newIdx !== vIdx || prevDoneCount !== vDone.length) {
        vIdx = newIdx;
        viewerShowFrame(vIdx, /*autoPlay=*/prevDoneCount === 0);
      }
    }
    viewerUpdateControls();
  } catch(e) {}
}

function viewerShowFrame(idx, autoPlay) {
  if (!vDone.length) return;
  idx = Math.max(0, Math.min(idx, vDone.length - 1));
  vIdx = idx;
  const frame = vDone[idx];

  const wrap = document.getElementById('viewer-wrap');
  const img  = document.getElementById('viewer-img');
  const cap  = document.getElementById('viewer-caption');
  const ph   = document.getElementById('viewer-placeholder');
  if (!img) return;

  wrap && wrap.classList.add('loading');
  img.onload = () => {
    wrap && wrap.classList.remove('loading');
    img.style.display = 'block';
    ph && (ph.style.display = 'none');
  };
  img.src = `/images/${esc(vProjId)}/${esc(frame.filename)}?t=${Date.now()}`;
  if (cap) {
    cap.textContent = frame.transcript || '';
    cap.style.display = frame.transcript ? 'block' : 'none';
  }

  // Sync audio
  const audio = document.getElementById('viewer-audio');
  if (audio && frame.timestamp_seconds !== undefined) {
    const target = frame.timestamp_seconds;
    if (Math.abs(audio.currentTime - target) > 1.5) {
      audio.currentTime = target;
    }
    if (autoPlay && !vMuted) {
      audio.play().catch(() => {});
    }
  }
  viewerUpdateControls();
}

function viewerUpdateControls() {
  const count = document.getElementById('viewer-count');
  const live  = document.getElementById('viewer-live-badge');
  const lBtn  = document.getElementById('vbtn-live');
  const prev  = document.getElementById('vbtn-prev');
  const next  = document.getElementById('vbtn-next');
  const play  = document.getElementById('vbtn-play');
  const audio = document.getElementById('viewer-audio');
  const isPlaying = audio && !audio.paused;

  if (count) count.textContent = `${vIdx + 1} / ${vDone.length}`;
  if (live)  live.style.display  = vLive ? 'flex' : 'none';
  if (lBtn)  lBtn.classList.toggle('active', vLive);
  if (prev)  prev.disabled = vIdx <= 0;
  if (next)  next.disabled = vIdx >= vDone.length - 1;
  if (play)  play.textContent = isPlaying ? '⏸ Pause' : '▶ Play';
}

function viewerPrev() {
  vLive = false;
  viewerShowFrame(vIdx - 1, false);
}
function viewerNext() {
  vLive = false;
  if (vIdx < vDone.length - 1) viewerShowFrame(vIdx + 1, false);
}
function viewerGoLive() {
  vLive = true;
  viewerShowFrame(vDone.length - 1, true);
  viewerUpdateControls();
}
function viewerTogglePlay() {
  const audio = document.getElementById('viewer-audio');
  if (!audio) return;
  if (audio.paused) { audio.play().catch(() => {}); } else { audio.pause(); }
  setTimeout(viewerUpdateControls, 100);
}

function viewerAudioTick() {
  const audio = document.getElementById('viewer-audio');
  const bar   = document.getElementById('audio-bar-fill');
  const time  = document.getElementById('viewer-time');
  if (!audio) return;
  const cur = audio.currentTime;
  const dur = audio.duration || 0;
  if (bar && dur) bar.style.width = (cur / dur * 100) + '%';
  if (time) time.textContent = fmtTime(cur) + (dur ? ' / ' + fmtTime(dur) : '');

  // Auto-advance frame based on audio position
  if (!vDone.length) return;
  // Find the frame whose timestamp_seconds <= currentTime and is the last such frame
  let best = 0;
  for (let i = 0; i < vDone.length; i++) {
    if (vDone[i].timestamp_seconds <= cur) best = i;
    else break;
  }
  if (best !== vIdx && vLive) {
    vIdx = best;
    viewerShowFrame(vIdx, false);
  }
}

function audioSeekClick(e) {
  const audio = document.getElementById('viewer-audio');
  const wrap  = document.getElementById('audio-bar-wrap');
  if (!audio || !wrap || !audio.duration) return;
  const rect = wrap.getBoundingClientRect();
  const pct  = (e.clientX - rect.left) / rect.width;
  audio.currentTime = pct * audio.duration;
  // Find matching frame
  const target = audio.currentTime;
  let best = 0;
  for (let i = 0; i < vDone.length; i++) {
    if (vDone[i].timestamp_seconds <= target) best = i;
    else break;
  }
  vLive = false;
  viewerShowFrame(best, false);
}

function fmtTime(s) {
  if (!isFinite(s)) return '0:00';
  const m = Math.floor(s / 60);
  const sec = Math.floor(s % 60);
  return m + ':' + String(sec).padStart(2, '0');
}

async function pollLog() {
  if (!selectedId) return;
  try {
    const r = await get('/api/project/'+selectedId+'/log?lines=80');
    const box = document.getElementById('log-box');
    if (!box) { clearInterval(logTimer); return; }
    const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 40;
    box.textContent = r.log || '(no log yet)';
    if (atBottom) box.scrollTop = box.scrollHeight;
  } catch(e) {}
}

// ── Paused ────────────────────────────────────────────────────────────────────
function renderPaused(p, el) {
  const prog  = p.progress || {};
  const done  = prog.done || prog.completed || 0;
  const total = prog.total || 0;

  el.innerHTML = `
    <div class="card">
      <div class="card-header"><div class="card-title">Generation Paused</div></div>
      <div class="alert alert-purple">
        Stopped by you${total>0 ? ` — ${done} of ${total} frames complete` : ''}. All progress is saved.
      </div>
      <p class="card-desc" style="margin-bottom:18px">
        Click Restart to continue from where it left off.
      </p>
      <div class="row">
        <button class="btn btn-primary" onclick="restartGeneration()">▶ Restart Generation</button>
      </div>
      <pre id="preflight-out"></pre>
    </div>
  `;
}

async function restartGeneration() {
  const btn = event.currentTarget;
  btn.disabled = true; btn.textContent = '⏳ Validating…';
  try {
    const r = await fetch('/api/project/'+selectedId+'/queue', { method:'POST' });
    const d = await r.json();
    if (d.ok) {
      await refreshProject();
    } else {
      btn.disabled=false; btn.textContent='▶ Restart Generation';
      const pf = document.getElementById('preflight-out');
      if (pf) { pf.style.display='block'; pf.textContent=d.preflight||d.error||'Failed.'; }
    }
  } catch(e) { btn.disabled=false; btn.textContent='▶ Restart Generation'; }
}

// ── Thumbnails ────────────────────────────────────────────────────────────────
function renderThumbnails(p, el) {
  const thumbs  = p.thumbs || {};
  const sel     = p.selected_thumbnail_variant;
  const anyDone = thumbs.v1||thumbs.v2||thumbs.v3;

  const cards = [1,2,3].map(i => thumbs[`v${i}`] ? `
    <div class="thumb-card${sel===i?' selected':''}" onclick="pickThumb(${i})">
      <img src="/thumbs/${esc(selectedId)}/thumbnail_v${i}.png?t=${Date.now()}" alt="Thumbnail ${i}">
      <div class="thumb-foot">
        <button class="btn ${sel===i?'btn-green':'btn-outline'}" onclick="pickThumb(${i});event.stopPropagation()" style="font-size:12px;padding:7px 16px">
          ${sel===i?'✓ Selected':'Use this'}
        </button>
      </div>
    </div>
  ` : `<div class="thumb-empty">v${i} not ready yet</div>`).join('');

  el.innerHTML = `
    <div class="card">
      <div class="card-header"><div class="card-title">Pick a Thumbnail</div></div>
      <p class="card-desc">Click the thumbnail you want to use, then upload to YouTube.</p>
      ${anyDone ? `
        <div class="thumb-grid">${cards}</div>
        ${sel ? `
          <hr class="divider">
          <div class="row">
            <button class="btn btn-primary" onclick="uploadYt()" ${p.yt_uploading?'disabled':''}>
              ${p.yt_uploading?'⏳ Uploading…':'↑ Upload to YouTube'}
            </button>
            ${p.yt_uploading?'<div class="spinner"></div>':''}
          </div>
        ` : `
          <div style="color:var(--muted-2);font-size:13px;margin-top:4px">← Select a thumbnail to unlock upload</div>
        `}
      ` : `<div class="alert alert-amber" style="margin-bottom:0">Thumbnails still generating — check back in a moment.</div>`}
    </div>
  `;
}

async function pickThumb(v) {
  if (!selectedId) return;
  const r = await post('/api/project/'+selectedId+'/pick-thumb', {variant:'v'+v});
  if (r.ok) refreshProject(); else alert('Error: '+(r.error||'Unknown'));
}
async function uploadYt() {
  if (!selectedId) return;
  const r = await fetch('/api/project/'+selectedId+'/youtube-upload', {method:'POST'});
  const d = await r.json();
  if (d.ok) setTimeout(refreshProject, 4000);
  else alert('Error: '+(d.error||'Upload failed'));
}

// ── Done ───────────────────────────────────────────────────────────────────────
function renderDone(p, el) {
  const yt = p.youtube_video_id;
  el.innerHTML = `
    <div class="card">
      <div class="card-header">
        <div class="card-title">Complete</div>
        <span style="font-size:20px">🎉</span>
      </div>
      <div class="alert alert-green" style="font-size:14px;font-weight:600">
        Video is live${yt ? ' on YouTube' : ' — ready to upload'}!
      </div>
      ${yt ? `
        <div style="border-radius:10px;overflow:hidden;background:#000;margin-bottom:16px">
          <iframe
            src="https://www.youtube.com/embed/${esc(yt)}?rel=0&modestbranding=1"
            style="width:100%;aspect-ratio:16/9;border:0;display:block"
            allow="accelerometer;autoplay;clipboard-write;encrypted-media;gyroscope;picture-in-picture"
            allowfullscreen></iframe>
        </div>
        <div id="yt-stats-${esc(p.id)}" style="display:flex;gap:20px;margin-bottom:14px;font-size:13px;color:var(--muted)">
          <span>Loading stats…</span>
        </div>
        <div class="info-row">
          <div class="info-item">
            <span class="ii-label">YouTube URL</span>
            <a class="ii-value" href="https://youtu.be/${esc(yt)}" target="_blank">youtu.be/${esc(yt)}</a>
          </div>
        </div>
      ` : `
        <p class="card-desc">Not uploaded to YouTube yet.</p>
        <div class="row">
          <button class="btn btn-primary" onclick="uploadYt()" ${p.yt_uploading?'disabled':''}>
            ${p.yt_uploading?'⏳ Uploading…':'↑ Upload to YouTube'}
          </button>
          ${p.yt_uploading?'<div class="spinner"></div>':''}
        </div>
      `}
    </div>
  `;
  if (yt) loadYtStats(p.id, yt);
}

async function loadYtStats(pid, videoId) {
  const el = document.getElementById(`yt-stats-${pid}`);
  if (!el) return;
  try {
    const r = await fetch(`/api/project/${pid}/youtube-stats`);
    const d = await r.json();
    if (d.error) { el.innerHTML = `<span style="color:var(--muted)">${d.error}</span>`; return; }
    const fmt = n => n >= 1000 ? (n/1000).toFixed(1)+'K' : n;
    el.innerHTML = `
      <span>👁 <strong>${fmt(d.views)}</strong> views</span>
      <span>👍 <strong>${fmt(d.likes)}</strong> likes</span>
      <span>💬 <strong>${fmt(d.comments)}</strong> comments</span>
      <button onclick="loadYtStats('${pid}','${videoId}')" style="margin-left:auto;background:none;border:none;color:var(--muted);cursor:pointer;font-size:12px">↻ refresh</button>
    `;
  } catch(e) {
    el.innerHTML = `<span style="color:var(--muted)">Could not load stats</span>`;
  }
}

// ── Failed ────────────────────────────────────────────────────────────────────
function renderFailed(el) {
  el.innerHTML = `
    <div class="card">
      <div class="card-header">
        <div class="card-title">Pipeline Failed</div>
        <button class="btn btn-outline" onclick="restartGeneration()" style="font-size:12px;padding:6px 14px">▶ Retry</button>
      </div>
      <div class="alert alert-red" style="margin-bottom:16px">The pipeline hit an error. See the log below for details.</div>
      <div id="log-box">Loading…</div>
    </div>
  `;
  clearInterval(logTimer);
  pollLog();
  logTimer = setInterval(pollLog, 5000);
}
</script>
